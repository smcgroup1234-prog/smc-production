    ${d.loss.map((l, j) => `<td><input class="inp num sm" data-f="loss" data-j="${j}" type="number" min="0" step="any" inputmode="decimal" value="${v(r.loss[j])}"></td>`).join('')}
    <td><button class="icon-btn" data-act="del" title="ลบแถวนี้">${SVG.x}</button></td>
  </tr>`;
}

function onEntryInput(e) {
  const t = e.target;
  if (t.id === 'eMpP' || t.id === 'eMpA') { E[t.id === 'eMpP' ? 'mpP' : 'mpA'] = numVal(t.value); markDirty(); updateEntryTotals(); return; }
  const tr = t.closest('tr[data-i]'); if (!tr) return;
  const r = E.rows[Number(tr.dataset.i)], f = t.dataset.f;
  if (!r || !f) return;
  if (f === 'product') {
    r.product = t.value;
    if (E.data.has.sachet) {
      const m = masterOf(t.value), s = tr.querySelector('[data-f="sachet"]');
      if (s) {
        s.readOnly = !!m; s.classList.toggle('ro', !!m);
        if (m) { s.value = m.sachet; r.sachet = m.sachet; }
      }
    }
  } else if (f === 'remark') r.remark = t.value;
  else if (f === 'loss') r.loss[Number(t.dataset.j)] = numVal(t.value);
  else r[f] = numVal(t.value);
  if (f === 'plan' || f === 'act') {
    const st = r.plan > 0 && r.act != null && !isNaN(r.act) ? statusOf(r.act, r.plan) : '';
    tr.querySelector('.rpct').innerHTML = st ? badge(st, fmtPct(pct(r.act, r.plan), 0)) : '<span class="muted">–</span>';
  }
  markDirty();
  updateEntryTotals();
}
function markDirty() {
  APP.dirty = true;
  const s = $('eState'); if (s) { s.className = 'badge s-warning'; s.innerHTML = '<i>!</i>ยังไม่ได้บันทึก'; }
}
function updateEntryTotals() {
  const d = E.data, u = d.unit;
  let P = 0, Pd = 0, A_ = 0, n = 0, actN = 0;
  E.rows.forEach(r => { if (r.product || r.plan || r.act) n++; const p = r.plan > 0 ? r.plan : 0; P += p; if (r.act != null && !isNaN(r.act)) { A_ += r.act; Pd += p; actN++; } });
  const ach = actN ? pct(A_, Pd) : null;
  const st = actN && Pd > 0 ? statusOf(A_, Pd) : 'off';
  $('eKpis').innerHTML = `
    <div class="card kpi"><div class="lbl">${SVG.plan}แผนวันนี้ (Plan)</div><div class="val num">${fmtN(P)}<small>${esc(u)}</small></div><div class="sub">${n} รายการสินค้า</div></div>
    <div class="card kpi"><div class="lbl">${SVG.act}ผลิตจริง (Actual)</div><div class="val num">${actN ? fmtN(A_) : '–'}<small>${esc(u)}</small></div><div class="sub">${actN ? `บันทึกแล้ว ${actN} รายการ` : 'ยังไม่บันทึก Actual'}</div></div>
    <div class="card kpi"><div class="lbl">${SVG.target}% Achievement</div><div class="val num">${fmtPct(ach)}</div>${kpiBar(ach)}<div class="sub">${actN ? badge(st) + (actN < n ? ' <small class="muted">คิดเฉพาะ ' + actN + ' รายการที่มี Actual</small>' : '') : badge('pend')}</div></div>
    <div class="card kpi"><div class="lbl">${SVG.people}Manpower</div><div class="val num">${E.mpA ?? '–'}<small>/ ${E.mpP ?? '–'} คน</small></div><div class="sub">${E.mpA > 0 && actN ? 'Productivity ' + fmtN(A_ / E.mpA) + ' ' + esc(u) + '/คน' : 'Actual / Plan'}</div></div>`;
}
const kpiBar = v => `<div class="bar"><i style="width:${Math.min(100, v || 0)}%;background:${achColor(v)}"></i><span class="tgt" style="left:${cfg().target}%"></span></div>`;

async function onEntryClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'add') {
    if (E.rows.length >= cfg().maxRows) return toast('เพิ่มได้สูงสุด ' + cfg().maxRows + ' รายการต่อวัน', 'err');
    E.rows.push(blankRow());
    $('eBody').insertAdjacentHTML('beforeend', rowHtml(E.rows[E.rows.length - 1], E.rows.length - 1));
    $('eBody').lastElementChild.querySelector('input').focus();
  } else if (act === 'del') {
    const i = Number(b.closest('tr').dataset.i);
    const r = E.rows[i];
    if ((r.product || r.plan != null || r.act != null) && !await askConfirm('ลบรายการ', `ลบแถว ${i + 1} ${r.product ? '“' + esc(r.product) + '”' : ''} ออกจากวันนี้? (มีผลเมื่อกดบันทึก)`, 'ลบแถว', true)) return;
    E.rows.splice(i, 1);
    if (!E.rows.length) E.rows.push(blankRow());
    $('eBody').innerHTML = E.rows.map(rowHtml).join('');
    markDirty(); updateEntryTotals();
  } else if (act === 'copyprev') {
    const prev = E.data.prev.rows;
    const keep = E.rows.filter(r => r.product || r.plan != null || r.act != null);
    if (keep.length && !await askConfirm('คัดลอกรายการ', `เพิ่ม ${prev.length} รายการจากวันที่ ${esc(thDate(E.data.prev.iso))} ต่อท้ายรายการที่มีอยู่ ${keep.length} รายการ?`, 'คัดลอก')) return;
    E.rows = keep.concat(prev.map(p => ({ ...blankRow(), product: p.product, sachet: p.sachet, plan: p.plan })));
    $('eBody').innerHTML = E.rows.map(rowHtml).join('');
    markDirty(); updateEntryTotals();
    toast('คัดลอกรายการสินค้า + Plan แล้ว — ตรวจแผนแล้วกรอก Actual');
  } else if (act === 'save') saveEntry(b);
}

async function saveEntry(btn) {
  const d = E.data, errs = [], over = [];
  E.rows.forEach((r, i) => {
    const nums = [r.plan, r.act, r.sachet].concat(r.loss);
    const any = r.plan != null || r.act != null || (r.remark || '').trim() || r.loss.some(v => v != null);
    if (nums.some(v => v != null && (isNaN(v) || v < 0))) errs.push(`แถว ${i + 1}: ตัวเลขต้องเป็นค่าบวก`);
    if (any && !String(r.product || '').trim()) errs.push(`แถว ${i + 1}: กรุณาระบุ Product`);
    if (d.has.sachet && r.product && (r.plan || r.act) && !(r.sachet > 0) && !masterOf(r.product)) errs.push(`แถว ${i + 1}: “${r.product}” ไม่มี Sachet/CT — ระบุตัวเลข หรือเพิ่มใน Product Master`);
    if (r.plan > 0 && r.act != null && r.act / r.plan * 100 > cfg().over) over.push(`แถว ${i + 1} ${r.product}: Actual ${fmtN(r.act)} = ${fmtPct(r.act / r.plan * 100, 0)} ของ Plan`);
  });
  [E.mpP, E.mpA].forEach(v => { if (v != null && (isNaN(v) || v < 0)) errs.push('Manpower ต้องเป็นจำนวนบวก'); });
  if (errs.length) return dlg({ title: 'ตรวจข้อมูลก่อนบันทึก', body: `<ul class="errlist">${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`, ok: 'แก้ไข', cancel: false });
  if (over.length && !await askConfirm('Actual สูงกว่าแผนผิดปกติ', `${over.map(esc).join('<br>')}<br><br>ตรวจหน่วย/ตัวเลขแล้ว ต้องการบันทึกต่อหรือไม่?`, 'บันทึกต่อ')) return;
  btn.disabled = true; btn.classList.add('spin');
  const st = $('eState'); if (st) { st.className = 'badge s-info'; st.innerHTML = '<i>…</i>กำลังบันทึก…'; }
  const t0 = Date.now();
  try {
    const res = await writeCall('saveEntry', {
      sheet: d.sheet, iso: d.iso, mpP: E.mpP, mpA: E.mpA,
      rows: E.rows.map(r => ({ product: r.product, sachet: r.sachet, plan: r.plan, act: r.act, remark: r.remark, loss: r.loss }))
    });
    APP.dirty = false; APP.dashCache.clear();
    toast(`บันทึก ${d.sheet} ${thDate(d.iso)} แล้ว (${res.rows} รายการ) · ${secs(t0)}${res.appended ? ' · เพิ่มแถวในชีต ' + res.appended + ' แถว' : ''}`);
    if (d.sheet === E.sheet && d.iso === E.iso) {
      // ใช้ข้อมูลที่ server เพิ่งเขียนเลย ไม่ต้องโหลดซ้ำ
      const sv = res.saved;
      sv.rows.forEach(r => { if (r.product && d.recent.indexOf(r.product) < 0) d.recent.unshift(r.product); });
      applyEntry({ ...d, rows: sv.rows, mpP: sv.mpP, mpA: sv.mpA, slots: Math.max(sv.slots, d.slots) });
      const ss = $('eState'); if (ss) { ss.className = 'badge s-good'; ss.innerHTML = `<i>✓</i>บันทึกแล้ว ${esc(res.savedAt)}`; }
    } else loadEntry(false);
    if (E.status && res.day) {
      const x = E.status.find(z => z.sheet === res.day.sheet);
      if (x) Object.assign(x, { n: res.day.n, P: res.day.P, A: res.day.A, actN: res.day.actN });
      if (E.statusIso === d.iso) renderDayStatus(); else loadDayStatus();
    } else loadDayStatus();
  } catch (e) {
    if (st) markDirty();
    if (errMsg(e) !== 'ยกเลิกการบันทึก') dlg({ title: 'บันทึกไม่สำเร็จ', body: `<div style="white-space:pre-wrap">${esc(errMsg(e))}</div>`, ok: 'ตกลง', cancel: false });
  } finally { btn.disabled = false; btn.classList.remove('spin'); }
}

/* ---------- แปลงหน่วย Packing: CT ⇄ Sachet (ใช้ Sachet/CT ของแต่ละสินค้า) ----------
   CT → Sachet = CT × Sachet/CT · Sachet → CT = Sachet ÷ Sachet/CT
   ไลน์ที่มีสินค้าไม่มี Sachet/CT → คงหน่วยเดิมทั้งไลน์ (เช่น ขึ้นรูปช็อคโกแลต = Sachet) ยังนับยอดตามปกติ ไม่เดาค่า */
function unitView(d) {
  const tgt = d.group.key === 'CT' ? A.uv : '';
  if (!tgt) return d;
  const fac = (from, sa) => from === tgt ? 1 : from === 'CT' && tgt === 'Sachet' ? (sa > 0 ? sa : null) : from === 'Sachet' && tgt === 'CT' ? (sa > 0 ? 1 / sa : null) : null;
  const keep = [];   // [{ i, why: [ชื่อสินค้า] }]
  const canConv = d.series.map((S, i) => {
    const from = d.lines[i].unit;
    if (from === tgt) return true;
    if (from !== 'CT' && from !== 'Sachet') { keep.push({ i, why: ['หน่วย ' + from] }); return false; }
    const why = new Set();
    S.prod.forEach((ps, k) => {
      const sp = (ps || []).reduce((t, e) => t + e[1], 0), sa = (ps || []).reduce((t, e) => t + e[3], 0);
      if (Math.abs(S.P[k] - sp) > 1e-9 || Math.abs(S.A[k] - sa) > 1e-9) why.add('แถวไม่มีชื่อสินค้า ' + dm(d.days[k].iso));
      (ps || []).forEach(e => { if (fac(from, e[6]) == null) why.add(e[0]); });
    });
    if (why.size) { keep.push({ i, why: [...why] }); return false; }
    return true;
  });
  const lines = d.lines.map((L, i) => canConv[i] ? { ...L, unit: tgt, srcUnit: L.unit } : L);
  const series = d.series.map((S, i) => {
    const from = d.lines[i].unit;
    if (from === tgt || !canConv[i]) return S;
    const P = S.P.map(() => 0), Ac = S.A.map(() => 0);
    const prod = S.prod.map((ps, k) => ps && ps.map(e => {
      const f = fac(from, e[6]); P[k] += e[1] * f; Ac[k] += e[3] * f;
      return [e[0], e[1] * f, e[2] * f, e[3] * f, e[4], e[5], e[6], e[7]];
    }));
    return { ...S, P, A: Ac, prod };
  });
  const products = d.products.map(p => {
    if (!canConv[p.li]) return p;
    const f = fac(d.lines[p.li].unit, p.sachet);
    return { ...p, P: p.P * f, Pd: p.Pd * f, A: p.A * f };
  });
  return { ...d, lines, series, products, conv: { tgt, keep } };
}

/* 1 กลุ่มมีได้หลายหน่วย (เช่น Process = Kg + Batch) — ยอดรวมแยกตามหน่วย ไม่บวกข้ามหน่วย
   P  = Plan ทั้งหมด (แสดงในยอดรวม/กราฟเสมอ)
   Pd = Plan เฉพาะวัน-ไลน์ที่บันทึก Actual แล้ว (ใช้คิด % Achievement / Gap — กันตัวเลขตกเพราะยังไม่ได้กรอก Actual) */
const UNIT_COL = [
  { p: '#c3c2b7', a: '#2a78d6', fill: 'rgba(42,120,214,.08)' },
  { p: '#f1cfb4', a: '#eb6834', fill: 'rgba(235,104,52,.08)' },
  { p: '#bfe3d3', a: '#1baf7a', fill: 'rgba(27,175,122,.08)' }
];
const unitCol = j => UNIT_COL[j % UNIT_COL.length];
const planCol = j => ['#6f6e69', '#c2541f', '#148a60'][j % 3];   // สี Plan (จุด + เส้นประ)
const planLeg = (j, txt) => `<span><i class="pd" style="--c:${planCol(j)}"></i>${txt}</span>`;
const achLegend = () => { const C = cfg(); return `<span><i class="sw" style="--c:${ACH_COLOR.good}"></i>≥ ${C.target}%</span><span><i class="sw" style="--c:${ACH_COLOR.warning}"></i>${C.warn}–${C.target - 0.1}%</span><span><i class="sw" style="--c:${ACH_COLOR.critical}"></i>&lt; ${C.warn}%</span>`; };
const isPendAt = (s, k) => s.P[k] > 0 && s.actN[k] === 0;
const lineUnit = i => A.data.lines[i].unit || A.data.group.key;
const lineColor = i => LINE_COLORS[i % LINE_COLORS.length];
const lnTag = i => `<span class="lname" style="--c:${lineColor(i)}"><i class="dot"></i>${esc(A.data.lines[i].name)}</span>`;

function achCompute() {
  const d = A.data, C = cfg(), isCT = d.group.key === 'CT';
  const idx = d.lines.map((_, i) => i).filter(i => A.sel.has(i));
  const units = [...new Set(idx.map(lineUnit))];
  const pend = [];
  const rows = d.days.map((day, k) => {
    const u = {}; units.forEach(x => { u[x] = { P: 0, Pd: 0, A: 0, pend: 0, work: false }; });
    let work = false, lossEq = 0, base = 0, mpA = null, mpP = null, pendN = 0, rem = [];
    idx.forEach(i => {
      const s = d.series[i], U = u[lineUnit(i)];
      if (s.P[k] > 0 || s.A[k] > 0 || s.n[k] > 0) { work = true; U.work = true; }
      U.P += s.P[k];
      if (isPendAt(s, k)) { pendN++; U.pend += s.P[k]; if (day.iso <= d.today) pend.push({ iso: day.iso, i, k, P: s.P[k] }); }
      else { U.Pd += s.P[k]; U.A += s.A[k]; }
      lossEq += s.lossEq[k]; base += s.base[k];
      if (s.mpA[k] != null) mpA = (mpA || 0) + s.mpA[k];
      if (s.mpP[k] != null) mpP = (mpP || 0) + s.mpP[k];
      if (s.rem[k]) rem.push(d.lines[i].name + ' · ' + s.rem[k]);
    });
    units.forEach(x => { u[x].pct = pct(u[x].A, u[x].Pd); });
    const f = u[units[0]] || { P: 0, Pd: 0, A: 0, pct: null };
    return { ...day, k, u, P: f.P, Pd: f.Pd, A: f.A, pct: f.pct, work, pendN, lossEq, base, mpA, mpP, rem: rem.join(' | ') };
  });
  const vis = A.hideOff ? rows.filter(r => r.work) : rows;
  const TU = {};
  units.forEach(x => {
    const pd = rows.filter(r => r.u[x].Pd > 0);
    const sum = f => rows.reduce((s, r) => s + r.u[x][f], 0);
    TU[x] = { P: sum('P'), Pd: sum('Pd'), A: sum('A'), pend: sum('pend'), planDays: pd.length,
      metDays: pd.filter(r => pctRound(r.u[x].pct) >= C.target).length, workDays: rows.filter(r => r.u[x].work).length };
  });
  const T0 = TU[units[0]] || { P: 0, Pd: 0, A: 0, pend: 0, planDays: 0, metDays: 0, workDays: 0 };
  const T = { ...T0, lossEq: rows.reduce((s, r) => s + r.lossEq, 0), base: rows.reduce((s, r) => s + r.base, 0) };
  const lines = idx.map(i => lineStats(i, 0, d.days.length - 1));
  const lossUnits = [...new Set(lines.filter(x => x.unit === 'Kg' || x.unit === 'CT' || x.unit === 'Sachet').map(x => x.unit))];
  return { idx, rows, vis, T, TU, units, multi: units.length > 1, planDays: T0.planDays, metDays: T0.metDays, lines, pend, isCT, lossUnits, workDays: rows.filter(r => r.work).length };
}

/** สถิติของ 1 ไลน์ในช่วง index วัน k0..k1 */
function lineStats(i, k0, k1) {
  const d = A.data, C = cfg(), s = d.series[i];
  let P = 0, Pd = 0, Ac = 0, pd = 0, met = 0, low = 0, zero = 0, worst = null, unplan = 0, pendD = 0, pendP = 0, manDays = 0, prodA = 0, mpDays = 0, mpPsum = 0, mpPdays = 0, kg = 0, lossEq = 0, base = 0;
  const lossTot = d.lines[i].loss.map(() => 0);
  for (let k = k0; k <= k1; k++) {
    const p = s.P[k], a = s.A[k];
    lossEq += s.lossEq[k]; base += s.base[k]; kg += s.lossKg[k];
    if (s.lt && s.lt[k]) s.lt[k].forEach((v, j) => { lossTot[j] += v || 0; });
    if (s.mpP[k] > 0) { mpPsum += s.mpP[k]; mpPdays++; }
    P += p;
    if (isPendAt(s, k)) { pendD++; pendP += p; continue; }
    Pd += p; Ac += a;
    if (s.mpA[k] > 0 && a > 0) { manDays += s.mpA[k]; prodA += a; mpDays++; }
    if (p > 0) {
      pd++; const v = a / p * 100;
      if (pctRound(v) >= C.target) met++; if (pctRound(v) < C.warn) low++; if (a === 0) zero++;
      if (!worst || v < worst.v) worst = { v, iso: d.days[k].iso, k };
    } else if (a > 0) unplan += a;
  }
  const hasLoss = d.lines[i].loss.length && (base + lossEq) > 0;
  return { i, name: d.lines[i].name, unit: lineUnit(i), color: lineColor(i), P, Pd, A: Ac, gap: Ac - Pd, ach: pct(Ac, Pd), pd, met, low, zero, worst, unplan, pendD, pendP,
    manDays, mpDays, avgMp: mpDays ? manDays / mpDays : null, avgMpP: mpPdays ? mpPsum / mpPdays : null, prod: manDays ? prodA / manDays : null,
    lossEq, base, lossPct: hasLoss ? lossEq / (base + lossEq) * 100 : null, kg, lossTot: d.lossTot ? (k0 === 0 && k1 === d.days.length - 1 ? d.lossTot[i] : lossTot) : lossTot, lossCols: d.lines[i].loss };
}

/* =================== Drill-down (กดกราฟ/ตารางเพื่อดูลึก + ย้อนกลับ) =================== */
A.drill = [];
function drillTo(v) { A.drill.push(v); renderAch(); stickCrumbs(); scrollAch(); }
function drillBack(n) { A.drill.splice(n == null ? A.drill.length - 1 : n); renderAch(); stickCrumbs(); scrollAch(); }
function stickCrumbs() {
  const c = document.querySelector('#aApp .crumbs'); if (!c) return;
  let h = 8; document.querySelectorAll('header').forEach(el => { if (el.offsetParent && getComputedStyle(el).position === 'sticky') h = Math.max(h, (parseFloat(getComputedStyle(el).top) || 0) + el.offsetHeight + 8); });
  c.style.top = Math.round(h) + 'px';
}
function scrollAch() { const el = $('aApp'); if (el) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 140), behavior: 'smooth' }); }
function drillLabel(v) {
  const d = A.data;
  if (v.t === 'line') return d.lines[v.i].name;
  if (v.t === 'day') return thDate(d.days[v.k].iso);
  if (v.t === 'cell') return d.lines[v.i].name + ' · ' + thDate(d.days[v.k].iso);
  if (v.t === 'prod') return v.name + ' (' + d.lines[v.i].name + ')';
  return '';
}
function crumbs() {
  if (!A.drill.length) return '';
  return `<div class="crumbs mt"><button class="btn" data-back>${SVG.left}ย้อนกลับ</button>
    <nav><a data-crumb="0">ภาพรวม ${esc(A.data.group.label)}</a>${A.drill.map((v, n) => n === A.drill.length - 1 ? ` › <b>${esc(drillLabel(v))}</b>` : ` › <a data-crumb="${n + 1}">${esc(drillLabel(v))}</a>`).join('')}</nav></div>`;
}
/** เพิ่ม onClick ให้กราฟ (index → callback) + เปลี่ยนเคอร์เซอร์เป็นมือ */
function clickable(opts, fn) {
  opts.onClick = (e, els) => { if (els && els.length) { const i = els[0].index, d = els[0].datasetIndex; setTimeout(() => fn(i, d), 0); } };   // หน่วงให้ Chart.js จบ event ก่อน destroy
  opts.onHover = (e, els) => { e.native && (e.native.target.style.cursor = els && els.length ? 'pointer' : 'default'); };
  return opts;
}
function resetCharts() { Object.keys(A.charts).forEach(k => { try { A.charts[k].destroy(); } catch (e) {} delete A.charts[k]; }); }

function renderAch() {
  if (!A.data) return;
  resetCharts();
  const R = achCompute();
  const top = A.drill[A.drill.length - 1];
  if (!top) { renderAchBody(R); renderAchCharts(R); }
  else if (top.t === 'line') renderLineView(top.i);
  else if (top.t === 'day') renderDayView(top.k, R);
  else if (top.t === 'cell') renderCellView(top.i, top.k);
  else if (top.t === 'prod') renderProdView(top.i, top.name);
  $('aChips').classList.toggle('dimchips', !!top && top.t !== 'day');
}

/** การ์ด KPI 5 ใบ (ใช้ทั้งภาพรวมและหน้าเจาะลึก) */
function achKpis(units, TU, o) {
  const C = cfg(), multi = units.length > 1;
  const one = (t, x, big) => `<div class="val num${big ? '' : ' v2'}">${fmtN(t)}<small>${esc(x)}${multi && !TU[x].P && !TU[x].A ? ' · ไม่มีข้อมูลในช่วงนี้' : ''}</small></div>`;
  const pendTxt = units.filter(x => TU[x].pend > 0).map(x => fmtN(TU[x].pend) + ' ' + x).join(' · ');
  const kPlan = multi ? `<div class="ulist">${units.map(x => one(TU[x].P, x)).join('')}</div>` : one(TU[units[0]].P, units[0], 1);
  const kAct = multi ? `<div class="ulist">${units.map(x => one(TU[x].A, x)).join('')}</div>` : one(TU[units[0]].A, units[0], 1);
  const achOf = x => pct(TU[x].A, TU[x].Pd);
  const kAch = multi ? `<div class="ulist">${units.map(x => `<div class="val num v2">${fmtPct(achOf(x))}<small>${esc(x)}</small> ${TU[x].Pd > 0 ? badge(statusOf(TU[x].A, TU[x].Pd), '') : ''}</div>`).join('')}</div><div class="sub">เป้า ≥ ${C.target}% (แยกตามหน่วย)</div>`
    : (() => { const t = TU[units[0]], a = achOf(units[0]); return `<div class="val num">${fmtPct(a)}</div>${kpiBar(a)}<div class="sub">${t.Pd > 0 ? badge(statusOf(t.A, t.Pd)) : t.P > 0 ? badge('pend') : badge('off')} เป้า ≥ ${C.target}%</div>`; })();
  const kGap = `<div class="ulist">${units.map(x => { const t = TU[x]; return `<div class="val num${multi ? ' v2' : ''} ${t.A - t.Pd >= 0 ? 'pos' : 'neg'}">${fmtSigned(t.A - t.Pd)}<small>${esc(x)}</small></div>`; }).join('')}</div>`;
  const lossBox = o.lossPct !== undefined
    ? `<div class="card kpi"><div class="lbl">${SVG.day}% Loss ${o.lossLabel || ''}</div><div class="val num">${fmtPct(o.lossPct, 2)}</div><div class="sub">${o.isCT ? 'Loss ซองเทียบเท่า ' + fmtN(o.lossEq) + ' ซอง' : o.lossUnits && o.lossUnits.length ? 'Loss รวม ' + fmtN(o.lossEq) + (o.lossUnits.indexOf('Kg') >= 0 ? ' kg' : ' ซอง') : 'ไม่คิด % Loss สำหรับหน่วยนี้'}</div></div>`
    : `<div class="card kpi"><div class="lbl">${SVG.people}Manpower</div><div class="val num">${o.mp != null ? fmtN(o.mp) : '–'}<small>${o.mpP != null ? '/ ' + fmtN(o.mpP) + ' ' : ''}คน</small></div><div class="sub">${o.prod != null ? 'Productivity ' + fmtN(o.prod) + ' ' + esc(units[0]) + '/คน/วัน' : 'Actual / Plan'}</div></div>`;
  return `
    <div class="card kpi"><div class="lbl">${SVG.plan}แผนรวม (Plan)</div>${kPlan}<div class="sub">${pendTxt ? `<span class="badge s-pend"><i>…</i>รอ Actual ${pendTxt}</span>` : (o.lines != null ? o.lines + ' ไลน์' : '')}</div></div>
    <div class="card kpi"><div class="lbl">${SVG.act}ผลผลิตจริง (Actual)</div>${kAct}<div class="sub">${!multi && o.workDays ? 'เฉลี่ย ' + fmtN(TU[units[0]].A / o.workDays) + ' ' + esc(units[0]) + '/วันทำงาน' : 'บันทึกแล้ว'}</div></div>
    <div class="card kpi"><div class="lbl">${SVG.target}% Achievement</div>${kAch}</div>
    <div class="card kpi"><div class="lbl">${SVG.gap}ส่วนต่าง (Actual − Plan)</div>${kGap}<div class="sub">เทียบแผนของวันที่บันทึก Actual แล้ว</div></div>
    ${lossBox}`;
}

function lineTable(R) {
  if (!R.lines.length) return '<div class="empty">เลือกอย่างน้อย 1 ไลน์</div>';
  const body = R.lines.map(x => {
    const st = x.Pd > 0 ? statusOf(x.A, x.Pd) : (x.A > 0 ? 'unplan' : (x.pendD ? 'pend' : 'off'));
    return `<tr class="click" data-dl="${x.i}"><td>${lnTag(x.i)}</td>
      ${R.multi ? `<td class="l"><span class="ltag">${esc(x.unit)}</span></td>` : ''}
      <td class="num">${fmtN(x.P)}${x.pendP ? `<br><small class="muted">รอ ${fmtN(x.pendP)}</small>` : ''}</td><td class="num">${fmtN(x.A)}</td><td class="num ${x.gap >= 0 ? 'pos' : 'neg'}">${fmtSigned(x.gap)}</td>
      <td class="num"><b>${fmtPct(x.ach)}</b></td><td class="num">${x.met} / ${x.pd}</td>
      <td class="num">${x.zero ? `<span class="neg">${x.zero}</span>` : '0'}</td>
      <td class="num">${x.pendD ? `<span class="badge s-pend"><i>…</i>${x.pendD}</span>` : '–'}</td>
      <td class="num">${fmtPct(x.lossPct, 2)}</td><td class="num">${x.kg ? fmtN(x.kg) : '–'}</td>
      <td class="num">${x.avgMp != null ? fmtN(x.avgMp) : '–'}${x.avgMpP != null ? ` <small class="muted">/ ${fmtN(x.avgMpP)}</small>` : ''}</td>
      <td class="num">${x.prod != null ? fmtN(x.prod) + ` <small class="muted">${esc(x.unit)}</small>` : '–'}</td>
      <td class="num">${x.worst ? `${fmtPct(x.worst.v)} <small class="muted">(${dm(x.worst.iso)})</small>` : '–'}</td>
      <td class="l">${badge(st)}</td></tr>`;
  }).join('');
  const foot = R.units.map(un => {
    const L = R.lines.filter(x => x.unit === un), t = R.TU[un];
    const sum = k => L.reduce((s, x) => s + (x[k] || 0), 0);
    const le = sum('lossEq'), b = sum('base');
    return `<tr><td>รวม (${esc(un)})</td>${R.multi ? '<td></td>' : ''}<td class="num">${fmtN(t.P)}</td><td class="num">${fmtN(t.A)}</td><td class="num ${t.A - t.Pd >= 0 ? 'pos' : 'neg'}">${fmtSigned(t.A - t.Pd)}</td>
      <td class="num">${fmtPct(pct(t.A, t.Pd))}</td><td class="num">${t.metDays} / ${t.planDays}</td><td class="num">${sum('zero')}</td><td class="num">${sum('pendD') || '–'}</td>
      <td class="num">${(un === 'Kg' || un === 'CT' || un === 'Sachet') && (b + le) > 0 ? fmtPct(le / (b + le) * 100, 2) : '–'}</td><td class="num">${fmtN(sum('kg')) || '–'}</td><td></td><td></td><td></td><td></td></tr>`;
  }).join('');
  return `<table><thead><tr><th>ไลน์</th>${R.multi ? '<th class="l">หน่วย</th>' : ''}<th>Plan</th><th>Actual</th><th>Gap</th><th>Achievement</th><th>วันผ่านเป้า</th><th>วันแผน&gt;0 ผลิต 0</th><th>รอ Actual</th><th>% Loss</th><th>Loss kg</th><th>คน/วัน (จริง/แผน)</th><th>ผลิต/คน/วัน</th><th>วันที่แย่สุด</th><th class="l">สถานะ</th></tr></thead>
    <tbody>${body}</tbody><tfoot>${foot}</tfoot></table>
    <p class="hint" style="margin:10px 0 0">Gap / Achievement เทียบกับ Plan ของวันที่บันทึก Actual แล้ว · ผลิต/คน/วัน = Actual ÷ คน-วัน (เฉพาะวันที่มีทั้ง Actual และ Manpower Actual)</p>`;
}

function lossBreakdown(lines, k0, k1) {
  const rows = lines.filter(x => x.lossCols.length && x.lossTot.some(v => v));
  if (!rows.length) return '<p class="hint" style="margin-top:10px">ยังไม่มีการบันทึก Loss ในช่วงนี้</p>';
  const a = k0 ?? 0, b = k1 ?? A.data.days.length - 1;
  return `<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>ไลน์</th><th>% Loss รวม</th><th class="l">แยกประเภท: จำนวน · % Defect (รวมช่วงที่เลือก)</th></tr></thead><tbody>${rows.map(x => {
    const T = lineTypeLoss(x.i, a, b);
    return `<tr class="click" data-dl="${x.i}"><td>${lnTag(x.i)}</td><td class="num"><b>${fmtPct(x.lossPct, 2)}</b></td><td class="l wrap">${x.lossCols.map((l, j) => x.lossTot[j] ? `<span class="ltag">${esc(lossName(l))} <b>${fmtN(x.lossTot[j])}</b> ${esc(l.unit)}${T.pct[j] != null ? ` · <b class="tp">${fmtPct(T.pct[j], 2)}</b>` : ''}</span>` : '').join('')}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
/** % Defect แยกประเภท รวมทุกไลน์ที่เลือก (จับคู่ประเภทด้วยชื่อคอลัมน์) */
function groupTypeLoss(R) {
  const acc = {}; let den = 0;
  R.lines.forEach(x => {
    const T = lineTypeLoss(x.i, 0, A.data.days.length - 1); den += T.den;
    A.data.lines[x.i].loss.forEach((l, j) => { if (T.eq[j] == null || !T.raw[j]) return; const k = keyOf(lossName(l)); (acc[k] || (acc[k] = { name: lossName(l), q: 0 })).q += T.eq[j]; });
  });
  const items = Object.values(acc).sort((a, b) => b.q - a.q);
  if (!items.length || !(den > 0)) return '';
  return `<div class="typesum"><span class="muted">% Defect แยกประเภท (รวมไลน์ที่เลือก):</span> ${items.map(x => `<span class="ltag">${esc(x.name)} <b class="tp">${fmtPct(x.q / den * 100, 2)}</b></span>`).join('')}</div>`;
}
/** กราฟแท่งแนวนอน % Defect แยกประเภท (ไลน์เดียว) */
function lossTypeChart(id, i, k0, k1) {
  const T = lineTypeLoss(i, k0, k1), L = A.data.lines[i].loss;
  const items = L.map((l, j) => ({ name: lossName(l), unit: l.unit, raw: T.raw[j], p: T.pct[j] })).filter(x => x.p != null && x.raw > 0).sort((a, b) => b.p - a.p);
  if (!items.length || !$(id)) return false;
  mkChart(A.charts, id, { type: 'bar', data: { labels: items.map(x => x.name), datasets: [{ data: items.map(x => x.p), backgroundColor: '#d03b3b', borderRadius: 4, maxBarThickness: 22 }] },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, barValue: { enabled: true, values: items.map(x => x.p), format: v => fmtPct(v, 2) },
      tooltip: { ...tooltipBase, callbacks: { label: c => { const x = items[c.dataIndex]; return [` % Defect: ${fmtPct(x.p, 2)}`, ` จำนวน: ${fmtN(x.raw)} ${x.unit}`]; } } } },
      scales: { x: { beginAtZero: true, suggestedMax: Math.max(...items.map(x => x.p)) * 1.3, grid: { color: '#efeee9' }, border: { display: false }, ticks: { callback: v => v + '%' } }, y: { grid: { display: false }, ticks: { font: { weight: '600' } } } } } });
  return items.length;
}

/* ---------- Loss แยกสินค้า × ประเภท (Loss อยู่แถวเดียวกับสินค้าในชีต) ---------- */
const lossName = l => l.name.replace(/^loss\s*/i, '').replace(/\s*\((kg|กก\.?)\)\s*$/i, '');
const lossKey = l => keyOf(lossName(l)) + '|' + l.unit;   // จับคู่ประเภท Loss ข้ามไลน์ด้วยชื่อ + หน่วย
/** คอลัมน์ Loss รวมของหลายไลน์ (จับคู่ด้วยชื่อคอลัมน์) */
function lossColsOf(lis) {
  const out = [], seen = {};
  [...new Set(lis)].forEach(i => A.data.lines[i].loss.forEach(l => { const k = lossKey(l); if (!seen[k]) { seen[k] = 1; out.push({ key: k, name: lossName(l), unit: l.unit }); } }));
  return out;
}
/** ค่า Loss ของประเภท c จาก array lt ของไลน์ i */
const lossVal = (i, lt, c) => { const j = A.data.lines[i].loss.findIndex(l => lossKey(l) === c.key); return j >= 0 && lt ? lt[j] || 0 : null; };
const lossTh = cols => cols.map(c => `<th>Loss ${esc(c.name)}${keyOf(c.name) === keyOf(c.unit) ? '' : `<br><small class="muted">${esc(c.unit)}</small>`}</th>`).join('');
/* % Defect แยกประเภท — ใช้ฐานเดียวกับ % Loss รวม: Loss ประเภทนั้น(เทียบเท่า) ÷ (ผลผลิตจริง + Loss รวม)
   Kg: เฉพาะ Loss หน่วย kg · Sachet: Loss ซอง · CT: Loss ซอง และ Loss ลัง × Sachet/CT · หน่วยอื่น (Batch) / ป่น kg ของไลน์แพ็ค: ไม่คิด % */
const srcUnit = i => (A.raw || A.data).lines[i].unit;
function typeEq1(i, j, v, sachet) {
  const u = srcUnit(i), lu = A.data.lines[i].loss[j].unit;
  if (u === 'Kg') return lu === 'kg' ? v : null;
  if (u === 'Sachet') return lu === 'ซอง' ? v : null;
  if (u === 'CT') return lu === 'ซอง' ? v : lu === 'ลัง' ? (sachet > 0 ? v * sachet : null) : null;
  return null;
}
/** Loss เทียบเท่าแยกประเภทของไลน์ i ในช่วงวัน k0..k1 + ฐาน (ผลผลิต + Loss) */
function lineTypeLoss(i, k0, k1) {
  const s = A.data.series[i], n = A.data.lines[i].loss.length;
  const raw = new Array(n).fill(0), eq = new Array(n).fill(null);
  let den = 0;
  for (let k = k0; k <= k1; k++) {
    den += (s.base[k] || 0) + (s.lossEq[k] || 0);
    (s.prod[k] || []).forEach(e => (e[7] || []).forEach((v, j) => {
      if (!v) return; raw[j] += v;
      const q = typeEq1(i, j, v, e[6]); if (q != null) eq[j] = (eq[j] || 0) + q;
    }));
  }
  return { raw, eq, den, pct: eq.map(q => q != null && den > 0 ? q / den * 100 : null) };
}
const pctSmall = v => v == null ? '' : `<br><small class="tpct">${fmtPct(v, 2)}</small>`;
const lossTd = (i, lt, cols, sachet, den) => cols.map(c => {
  const v = lossVal(i, lt, c);
  if (v == null) return '<td class="num"><span class="muted">·</span></td>';
  const j = A.data.lines[i].loss.findIndex(l => lossKey(l) === c.key), q = v && den > 0 ? typeEq1(i, j, v, sachet) : null;
  return `<td class="num">${v ? fmtN(v) : '–'}${q != null ? pctSmall(q / den * 100) : ''}</td>`;
}).join('');
const ltSum = lt => (lt || []).reduce((t, v) => t + (v || 0), 0);

/** ตารางสินค้าที่มี Loss เรียงตาม % Loss (ภาพรวม / หน้าไลน์) */
function lossProdTable(onlyLine) {
  const d = A.data;
  const list = d.products.filter(p => (onlyLine != null ? p.li === onlyLine : A.sel.has(p.li)) && ltSum(p.lt) > 0)
    .map(p => ({ p, lp: (p.base + p.lossEq) > 0 ? p.lossEq / (p.base + p.lossEq) * 100 : null }))
    .sort((a, b) => (b.lp ?? -1) - (a.lp ?? -1) || ltSum(b.p.lt) - ltSum(a.p.lt));
  if (!list.length) return '<div class="empty">ยังไม่มีการบันทึก Loss ของสินค้าในช่วงนี้</div>';
  const cols = lossColsOf(list.map(x => x.p.li));
  A.lossList = list.map(x => x.p);
  const tot = cols.map(c => list.reduce((t, x) => t + (lossVal(x.p.li, x.p.lt, c) || 0), 0));
  // หัวคอลัมน์ "Loss ที่ใช้คิด %" ตามหน่วยของไลน์: Process (Kg) = Loss รวม kg · Packing = Loss ซองเทียบเท่า
  const us = new Set(list.map(x => srcUnit(x.p.li)));
  const pk = us.has('CT') || us.has('Sachet'), kg = us.has('Kg');
  const eqTh = pk && kg ? 'Loss รวม<br><small class="muted">kg / ซอง</small>' : pk ? 'Loss ซองเทียบเท่า' : 'Loss รวม<br><small class="muted">kg</small>';
  const eqUnit = i => srcUnit(i) === 'Kg' ? 'kg' : 'ซอง';
  const note = [kg ? 'Process (Kg): % Loss = Loss รวม (kg) ÷ (Actual + Loss รวม)' : '', pk ? 'Packing: Loss ซองเทียบเท่า = Loss ซอง + Loss ลัง × Sachet/CT · % Loss = Loss ซองเทียบเท่า ÷ (ซองที่ผลิตได้ + Loss) · ป่น (kg) ไม่คิด %' : ''].filter(Boolean).join(' · ');
  return `<table><thead><tr>${onlyLine != null ? '' : '<th>ไลน์</th>'}<th class="l">สินค้า</th><th>ครั้งที่ผลิต</th><th>Actual</th>${lossTh(cols)}<th>${eqTh}</th><th>% Loss</th></tr></thead><tbody>${list.map((x, n) => {
    const p = x.p;
    return `<tr class="click" data-dlp="${n}">${onlyLine != null ? '' : `<td>${lnTag(p.li)}</td>`}<td class="l"><b>${esc(p.name)}</b></td><td class="num">${p.n}</td><td class="num">${fmtN(p.A)} <small class="muted">${esc(lineUnit(p.li))}</small></td>
      ${lossTd(p.li, p.lt, cols, p.sachet, p.base + p.lossEq)}<td class="num">${p.lossEq ? fmtN(p.lossEq) + (pk && kg ? ` <small class="muted">${eqUnit(p.li)}</small>` : '') : '–'}</td><td class="num">${x.lp != null ? `<b class="${x.lp >= 2 ? 'neg' : ''}">${fmtPct(x.lp, 2)}</b>` : '–'}</td></tr>`;
  }).join('')}</tbody><tfoot><tr>${onlyLine != null ? '' : '<td></td>'}<td class="l">รวม ${list.length} สินค้า</td><td></td><td></td>${tot.map(v => `<td class="num">${v ? fmtN(v) : '–'}</td>`).join('')}<td class="num">${pk && kg ? '' : fmtN(list.reduce((t, x) => t + x.p.lossEq, 0))}</td><td></td></tr></tfoot></table>
    <p class="hint" style="margin:10px 0 0">${note} · ตัวเลขเล็กใต้จำนวน = % Defect ของประเภทนั้น (รวมทุกประเภท = % Loss) · คลิกแถวเพื่อดูสินค้ารายวัน</p>`;
}

function productTable(R, onlyLine) {
  const d = A.data, isCT = R.isCT, q = keyOf(A.pq);
  const list = d.products.filter(p => (onlyLine != null ? p.li === onlyLine : A.sel.has(p.li)) && (onlyLine != null || !q || keyOf(p.name).indexOf(q) >= 0 || keyOf(d.lines[p.li].name).indexOf(q) >= 0))
    .sort((a, b) => (d.lines[a.li].unit || '').localeCompare(d.lines[b.li].unit || '') || b.A - a.A || b.P - a.P);

    const a = pct(p.A, p.Pd);

      <td class="num">${(p.base + p.lossEq) > 0 ? fmtPct(p.lossEq / (p.base + p.lossEq) * 100, 2) : '–'}</td></tr>`;
  }).join('')}</tbody></table>`;
}

const hmCell = (p, a, pendP, attr) => {

  if (st === 'off') return `<td class="hm"><div class="cell s-off"><b>–</b><small>&nbsp;</small></div></td>`;
  const v = p > 0 ? fmtPct(a / p * 100) : 'N/A';
  return `<td class="hm click" ${attr || ''} title="${STATUS[st].label}"><div class="cell s-${st}"><b><i>${STATUS[st].icon}</i>${v}</b><small class="num">${fmtN(a)} / ${fmtN(p)}</small></div></td>`;

}

/* ---------- เจาะลึก: สินค้า (แนวโน้มรายวันในไลน์นั้น) ---------- */
function renderProdView(i, name) {
  const d = A.data, s = d.series[i], u = lineUnit(i);
  const ks = [], rows = [];

  const P = sum(1), Pd = sum(2), Ac = sum(3), le = sum(4), b = sum(5);

  const pcols = lossColsOf([i]);
  $('aApp').innerHTML = `${crumbs()}
    <div class="dhead mt"><h2>${esc(name)}</h2><p>${lnTag(i)} · ${rows.length} วันที่ผลิต · ${thDate(d.from)} – ${thDate(d.to)}</p></div>
    <section class="grid kpis mt">${achKpis([u], TU, { lossPct: d.lines[i].loss.length && (b + le) > 0 ? le / (b + le) * 100 : null, lossLabel: u === 'Kg' ? '(kg)' : '(ซอง)', lossEq: le, lossUnits: d.lines[i].loss.length ? [u] : [], isCT: u === 'CT' })}</section>

        const k = ks[n], st = e[2] > 0 ? statusOf(e[3], e[2]) : e[1] > 0 ? 'pend' : e[3] > 0 ? 'unplan' : 'off';
        return `<tr class="click" data-dc="${i},${k}"><td><b>${dm(d.days[k].iso)}</b></td><td class="l">${esc(d.days[k].dow)}</td><td class="num">${fmtN(e[1])}</td><td class="num">${st === 'pend' ? '<span class="muted">รอ</span>' : fmtN(e[3])}</td>
          <td class="num">${st === 'off' ? '–' : badge(st, st === 'pend' ? 'รอ Actual' : e[2] > 0 ? fmtPct(e[3] / e[2] * 100) : undefined)}</td>${lossTd(i, e[7], pcols, e[6], e[5] + e[4])}${d.lines[i].loss.length ? `<td class="num">${(e[5] + e[4]) > 0 ? fmtPct(e[4] / (e[5] + e[4]) * 100, 2) : '–'}</td>` : ''}</tr>`;
      }).join('') || '<tr><td colspan="8" class="empty">ไม่มีข้อมูล</td></tr>'}</tbody>${rows.length ? `<tfoot><tr><td>รวม</td><td></td><td class="num">${fmtN(P)}</td><td class="num">${fmtN(Ac)}</td><td></td>${pcols.map(c => { const j = d.lines[i].loss.findIndex(l => lossKey(l) === c.key); let v = 0, q = null; rows.forEach(e => { const x = lossVal(i, e[7], c) || 0; v += x; const z = x ? typeEq1(i, j, x, e[6]) : null; if (z != null) q = (q || 0) + z; }); return `<td class="num">${v ? fmtN(v) : '–'}${q != null && (b + le) > 0 ? pctSmall(q / (b + le) * 100) : ''}</td>`; }).join('')}${d.lines[i].loss.length ? `<td class="num">${(b + le) > 0 ? fmtPct(le / (b + le) * 100, 2) : '–'}</td>` : ''}</tr></tfoot>` : ''}</table></div></section>`;
  mkChart(A.charts, 'dProd', { type: 'bar', data: { labels: ks.map(k => dm(d.days[k].iso)), datasets: [
      { label: 'Plan', data: rows.map(e => e[1] || null), type: 'line', borderDash: [6, 4], borderWidth: 1.5, pointRadius: 4, pointHoverRadius: 6, pointStyle: 'circle', spanGaps: true, order: 0, borderColor: planCol(0), backgroundColor: planCol(0), pointBackgroundColor: '#fff', pointBorderWidth: 2 },
      { label: 'Actual', data: rows.map(e => e[2] > 0 || e[3] > 0 ? e[3] : null), backgroundColor: rows.map(e => e[2] > 0 ? achColor(e[3] / e[2] * 100) : unitCol(0).a), borderRadius: 4, maxBarThickness: 18 }] },

/* ---------- คลิกในหน้า Dashboard ---------- */
function onAchClick(e) {
  const t = e.target;
  if (t.closest('[data-back]')) return drillBack();
  const cr = t.closest('[data-crumb]'); if (cr) return drillBack(Number(cr.dataset.crumb));
  const en = t.closest('[data-entry]');
  if (en) { const [sheet, iso] = en.dataset.entry.split('|'); go('entry').then(() => { if (APP.page === 'entry') switchEntry(sheet, iso); }); return; }
  const top = A.drill[A.drill.length - 1];
  const ds = t.closest('[data-dstep]'); if (ds && top && top.t === 'day') { const k = top.k + Number(ds.dataset.dstep); if (k >= 0 && k < A.data.days.length) { top.k = k; renderAch(); } return; }
  const cs = t.closest('[data-cstep]'); if (cs && top && top.t === 'cell') { const k = top.k + Number(cs.dataset.cstep); if (k >= 0 && k < A.data.days.length) { top.k = k; renderAch(); } return; }
  const c = t.closest('[data-dc]'); if (c) { const [i, k] = c.dataset.dc.split(',').map(Number); return drillTo({ t: 'cell', i, k }); }
  const dd = t.closest('[data-dd]'); if (dd) return drillTo({ t: 'day', k: Number(dd.dataset.dd) });
  const dl = t.closest('[data-dl]'); if (dl) return drillTo({ t: 'line', i: Number(dl.dataset.dl) });
  const dlp = t.closest('[data-dlp]'); if (dlp && A.lossList) { const p = A.lossList[Number(dlp.dataset.dlp)]; if (p) return drillTo({ t: 'prod', i: p.li, name: p.name }); }
  const dp = t.closest('[data-dp]'); if (dp && A.prodList) { const p = A.prodList[Number(dp.dataset.dp)]; if (p) return drillTo({ t: 'prod', i: p.li, name: p.name }); }
  const dpn = t.closest('[data-dpn]'); if (dpn && top && top.t === 'cell') return drillTo({ t: 'prod', i: top.i, name: dpn.dataset.dpn });
}

/* ---------------- Charts ---------------- */
let CHART_OK = false, CHART_FAILED = false;
const targetLinePlugin = {
  id: 'targetLine',
  afterDatasetsDraw(chart, _a, o) {
    if (!o || o.value == null) return;
    const { ctx, chartArea: ca } = chart, ax = o.axis || 'y', sc = chart.scales[ax], px = sc.getPixelForValue(o.value);
    ctx.save(); ctx.strokeStyle = '#52514e'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); ctx.beginPath();
    if (ax === 'y') { ctx.moveTo(ca.left, px); ctx.lineTo(ca.right, px); } else { ctx.moveTo(px, ca.top); ctx.lineTo(px, ca.bottom); }
    ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#52514e'; ctx.font = '600 11px ' + Chart.defaults.font.family;
    if (ax === 'y') { ctx.textAlign = 'right'; ctx.fillText(o.label, ca.right - 4, px - 5); } else { ctx.textAlign = 'left'; ctx.fillText(o.label, px + 4, ca.bottom - 6); }
    ctx.restore();
  }
};
const barValuePlugin = {
  id: 'barValue',
  afterDatasetsDraw(chart, _a, o) {
    if (!o || !o.enabled) return;
    const { ctx } = chart; ctx.save(); ctx.font = '600 11.5px ' + Chart.defaults.font.family; ctx.fillStyle = '#0b0b0b'; ctx.textBaseline = 'middle';
    chart.getDatasetMeta(0).data.forEach((el, i) => { const v = o.values[i]; if (v == null) return; ctx.textAlign = 'left'; ctx.fillText(o.format(v), Math.min(el.x + 6, chart.chartArea.right - 44), el.y); });
    ctx.restore();
  }
};
function setupCharts() {
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.size = 11.5; Chart.defaults.color = '#52514e'; Chart.defaults.borderColor = '#e1e0d9';
  Chart.register(targetLinePlugin, barValuePlugin);
  CHART_OK = true;
}
function noChart(boxId) {
  const el = $(boxId); if (!el || el.querySelector('.nochart')) return;
  el.insertAdjacentHTML('beforeend', '<div class="empty nochart" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">โหลดกราฟไม่ได้ — เครือข่ายบล็อก CDN ของ Chart.js (ตัวเลข/ตารางยังใช้งานได้)</div>');
}
function mkChart(store, id, config) {
  const c = $(id); if (!c) return;
  if (!CHART_OK) { if (CHART_FAILED) noChart(c.parentElement.id); return; }
  if (store[id]) store[id].destroy();
  store[id] = new Chart(c, config);
}
const tooltipBase = { backgroundColor: '#0b0b0b', titleColor: '#fff', bodyColor: '#f0efec', padding: 10, cornerRadius: 8, boxPadding: 4, usePointStyle: true };

function renderAchCharts(R) {
  const C = cfg(), rows = R.vis, CH = A.charts, U = R.units, multi = R.multi;

    const sc = { x: { grid: { display: false } }, y0: { position: 'left', beginAtZero: true, border: { display: false }, ticks: { callback: fmtTick }, title: { display: multi, text: U[0] } } };
    if (multi) sc.y1 = { position: 'right', beginAtZero: true, grid: { display: false }, border: { display: false }, ticks: { callback: fmtTick }, title: { display: true, text: U.slice(1).join(' / ') } };

  };

  const unitOfDs = c => c.dataset.unit;

  const dsDaily = [];
  U.forEach((x, j) => {
    dsDaily.push({ label: 'Plan' + (multi ? ' ' + x : ''), unit: x, data: rows.map(r => r.u[x].P || null), type: 'line', borderDash: [6, 4], borderWidth: 1.5, pointRadius: 4, pointHoverRadius: 6, pointStyle: 'circle', spanGaps: true, order: 0, borderColor: planCol(j), backgroundColor: planCol(j), pointBackgroundColor: '#fff', pointBorderWidth: 2, yAxisID: axis(j) });
    dsDaily.push({ label: 'Actual' + (multi ? ' ' + x : ''), unit: x, data: rows.map(r => r.u[x].A), backgroundColor: multi ? unitCol(j).a : rows.map(r => r.u[x].Pd > 0 ? achColor(r.u[x].pct) : unitCol(j).a), borderRadius: 4, maxBarThickness: 16, categoryPercentage: .72, barPercentage: .92, yAxisID: axis(j) });
  });
  mkChart(CH, 'cDaily', { type: 'bar', data: { labels, datasets: dsDaily },
    options: clickable({ maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tooltipBase, callbacks: { title: titleCb, label: c => ` ${c.dataset.label}: ${fmtN(c.parsed.y)} ${unitOfDs(c)}`,
        footer: items => { const r = rows[items[0].dataIndex]; return U.map(x => `${multi ? x + ' ' : ''}Achievement: ${fmtPct(r.u[x].pct)}   Gap: ${fmtSigned(r.u[x].A - r.u[x].Pd)}${r.u[x].pend ? '   รอ Actual ' + fmtN(r.u[x].pend) : ''}`).join('\n') + '\nคลิกเพื่อดูรายละเอียดวันนี้'; } } } },
      scales: axes(v => fmtN(v)) }, toDay) });

  // 2) % Achievement แยกไลน์ (เป็น % เทียบข้ามหน่วยได้)
  const L = R.lines, maxL = Math.max(110, ...L.map(x => x.ach || 0));
  mkChart(CH, 'cLine', { type: 'bar', data: { labels: L.map(x => x.name), datasets: [{ data: L.map(x => x.ach ?? 0), backgroundColor: L.map(x => achColor(x.ach)), borderRadius: 4, maxBarThickness: 22 }] },
    options: clickable({ indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, targetLine: { value: C.target, axis: 'x', label: `เป้า ${C.target}%` },
      barValue: { enabled: true, values: L.map(x => x.ach), format: v => fmtPct(v) },
      tooltip: { ...tooltipBase, callbacks: { label: c => { const x = L[c.dataIndex]; return [` Achievement: ${fmtPct(x.ach)}`, ` Plan ${fmtN(x.P)} · Actual ${fmtN(x.A)} ${x.unit}`].concat(x.pendP ? [` รอ Actual ${fmtN(x.pendP)}`] : []).concat([' คลิกเพื่อดูรายละเอียดไลน์']); } } } },
      scales: { x: { min: 0, max: Math.min(400, Math.ceil(maxL / 10) * 10 + 15), grid: { color: '#efeee9' }, border: { display: false }, ticks: { callback: v => v + '%' } }, y: { grid: { display: false }, ticks: { font: { weight: '600' } } } } }, n => drillTo({ t: 'line', i: L[n].i })) });

  // 3) % Achievement รายวัน (แยกเส้นตามหน่วย)
  const allPct = [];
  U.forEach(x => rows.forEach(r => { if (r.u[x].pct != null) allPct.push(r.u[x].pct); }));
  const realMax = Math.max(0, ...allPct);
  const cap = realMax > 200 ? 200 : Math.max(120, Math.ceil(realMax / 10) * 10 + 10);
  const ptCol = x => rows.map(r => ACH_COLOR[statusOf(r.u[x].A, r.u[x].Pd)] || '#c3c2b7');
  mkChart(CH, 'cPct', { type: 'line', data: { labels, datasets: U.map((x, j) => ({ label: x, unit: x, data: rows.map(r => r.u[x].pct == null ? null : Math.min(r.u[x].pct, cap)),
      borderColor: unitCol(j).a, borderWidth: 2, tension: .25, spanGaps: true, pointRadius: 4.5, pointHoverRadius: 6,
      pointBackgroundColor: ptCol(x), pointBorderColor: multi ? unitCol(j).a : '#fff', pointBorderWidth: 2 })) },
    options: clickable({ maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, targetLine: { value: C.target, axis: 'y', label: `เป้า ${C.target}%` },
        tooltip: { ...tooltipBase, callbacks: { title: titleCb, label: c => { const r = rows[c.dataIndex], t = r.u[unitOfDs(c)]; return [` ${multi ? unitOfDs(c) + ' ' : ''}Achievement: ${fmtPct(t.pct)}`, ` Plan ${fmtN(t.Pd)} · Actual ${fmtN(t.A)} ${unitOfDs(c)}`]; } } } },
      scales: { x: { grid: { display: false } }, y: { min: 0, max: cap, border: { display: false }, ticks: { callback: v => v + '%' } } } }, toDay) });

  // 4) ยอดสะสม (แกนแยกตามหน่วย)
  const cum = {};
  U.forEach(x => { let cp = 0, ca = 0, cd = 0; cum[x] = { P: rows.map(r => (cp += r.u[x].P)), A: rows.map(r => (ca += r.u[x].A)), Pd: rows.map(r => (cd += r.u[x].Pd)) }; });
  const dsCum = [];
  U.forEach((x, j) => {
    dsCum.push({ label: 'Plan สะสม' + (multi ? ' ' + x : ''), unit: x, data: cum[x].P, borderColor: j ? unitCol(j).a : '#86857f', borderDash: [6, 4], borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: .15, yAxisID: axis(j) });
    dsCum.push({ label: 'Actual สะสม' + (multi ? ' ' + x : ''), unit: x, data: cum[x].A, borderColor: unitCol(j).a, backgroundColor: unitCol(j).fill, fill: !multi, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: .15, yAxisID: axis(j) });
  });
  mkChart(CH, 'cCum', { type: 'line', data: { labels, datasets: dsCum },
    options: clickable({ maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tooltipBase, callbacks: { title: titleCb, label: c => ` ${c.dataset.label}: ${fmtN(c.parsed.y)} ${unitOfDs(c)}`,
        footer: items => { const i = items[0].dataIndex; return U.map(x => `${multi ? x + ' ' : ''}สะสม ${fmtPct(pct(cum[x].A[i], cum[x].Pd[i]))} · ขาด/เกิน ${fmtSigned(cum[x].A[i] - cum[x].Pd[i])}`).join('\n'); } } } },
      scales: axes(v => fmtN(v)) }, toDay) });
  const last = rows.length - 1;
  if ($('cumSub')) $('cumSub').textContent = last >= 0 ? `ณ ${thDate(rows[last].iso)}: Actual / Plan ` + U.map(x => `${fmtN(cum[x].A[last])} / ${fmtN(cum[x].P[last])} ${x}`).join(' · ') + ' · คลิกเพื่อดูวันนั้น' : 'ไม่มีข้อมูลในช่วงที่เลือก';

  // 5) % Loss แยกไลน์
  const LL = L.filter(x => x.lossPct != null);
  mkChart(CH, 'cLoss', { type: 'bar', data: { labels: LL.map(x => x.name), datasets: [{ data: LL.map(x => x.lossPct), backgroundColor: LL.map(x => x.color), borderRadius: 4, maxBarThickness: 22 }] },
    options: clickable({ indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, barValue: { enabled: true, values: LL.map(x => x.lossPct), format: v => fmtPct(v, 2) },
      tooltip: { ...tooltipBase, callbacks: { label: c => { const x = LL[c.dataIndex], lu = x.unit === 'Kg' ? 'kg' : 'ซอง'; return [` % Loss: ${fmtPct(x.lossPct, 2)}`, ` Loss ${fmtN(x.lossEq)} ${lu} จาก ${fmtN(x.base)} ${lu}`]; } } } },
      scales: { x: { beginAtZero: true, suggestedMax: Math.max(1, ...LL.map(x => x.lossPct)) * 1.25, grid: { color: '#efeee9' }, border: { display: false }, ticks: { callback: v => v + '%' } }, y: { grid: { display: false }, ticks: { font: { weight: '600' } } } } }, n => drillTo({ t: 'line', i: LL[n].i })) });
  if (!LL.length && $('bLoss')) $('bLoss').innerHTML = '<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center">ยังไม่มีข้อมูล Loss</div>';

  // 6) Manpower รายวัน (คน — รวมข้ามหน่วยได้)
  mkChart(CH, 'cMp', { type: 'bar', data: { labels, datasets: [
      { type: 'line', label: 'Manpower Plan', data: rows.map(r => r.mpP), borderColor: '#86857f', borderDash: [5, 4], borderWidth: 2, pointRadius: 2, spanGaps: true },
      { label: 'Manpower Actual', data: rows.map(r => r.mpA), backgroundColor: '#1baf7a', borderRadius: 4, maxBarThickness: 16 }] },
    options: clickable({ maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tooltipBase, callbacks: { title: titleCb, label: c => ` ${c.dataset.label}: ${c.parsed.y == null ? '-' : fmtN(c.parsed.y)} คน`,
        footer: items => { const r = rows[items[0].dataIndex]; return !multi && r.mpA > 0 && r.A > 0 ? `Productivity ≈ ${fmtN(r.A / r.mpA)} ${U[0]}/คน` : ''; } } } },
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true, border: { display: false }, ticks: { precision: 0 } } } }, toDay) });
}

    const v = n(k), p = base.length ? v / base.length * 100 : 0;
    return `<div class="strow"><span>${sBadge({ statusKey: k, status: '' }, key)}</span><div class="bar"><i style="width:${p}%;background:${MST[k].color}"></i></div><span class="n num">${v} <small>(${p.toFixed(0)}%)</small></span></div>`;
  }).join('')}</div>`;
}

function logCard(key, it, idx) {
  const d = LOGS[key].data, v = it.val;
  const title = v[d.titleKey] || (it.plan ? 'แผนเดิน Patrol (ยังไม่บันทึกผล)' : '(ไม่ระบุ)');
  const sub = d.subKey ? v[d.subKey] : '';
  const blocks = d.fields.filter(f => f.type === 'textarea' && f.k !== d.titleKey).map(f => {
    const cls = f.k === 'cause' ? 'cause' : (f.k === 'solution' ? 'fix' : '');
    const icon = f.k === 'cause' ? SVG.search : SVG.wrench;
    if (key === 'improve' && f.k === 'solution') return `<div class="ic-block fix"><h4>${icon}${esc(f.label.replace(/\s*\(.*\)$/, ''))}</h4>${planList(v[f.k])}</div>`;
    if (!v[f.k] && f.k !== 'solution') return '';
    return `<div class="ic-block ${cls}"><h4>${icon}${esc(f.label)}</h4><p class="clamp">${v[f.k] ? esc(v[f.k]) : '<span class="muted">ยังไม่มีการบันทึก</span>'}</p></div>`;
  }).join('');
  const age = ageOf(it);
  const meta = [
    it.iso && `<span title="วันที่">${SVG.cal}${esc(thDate(it.iso))}</span>`,
    ...d.fields.filter(f => f.type === 'text' && f.k !== d.titleKey && f.k !== d.subKey && v[f.k]).map(f => `<span title="${esc(f.label)}">${f.k === 'line' ? SVG.line : SVG.user}${esc(v[f.k])}</span>`),
    age != null && `<span class="${age > 30 ? 'due-late' : ''}" title="จำนวนวันที่ยังไม่ปิด">${SVG.clock}เปิดมา ${age} วัน</span>`
  ].filter(Boolean);
  const steps = { open: 0, progress: 1, closed: 2 }[it.statusKey];
  const names = key === 'improve' ? ['วางแผน', 'ดำเนินการ', 'เสร็จสิ้น'] : ['รับเรื่อง', 'กำลังแก้ไข', 'ปิดงาน'];
  const subIcon = d.subKey === 'machine' ? SVG.machine : d.subKey === 'line' ? SVG.line : SVG.user;
  return `<article class="icard st-${it.statusKey}">
    <div class="ic-mwrap">${cardMedia(it, idx, key)}</div>
    <div class="ic-main">
      <div class="ic-body">
        <div class="ic-head"><span class="ic-id">${esc(itemId(d, it))}</span>${sBadge(it, key)}</div>
        <h3 class="ic-title" title="${esc(title)}">${esc(title)}</h3>
        ${sub ? `<div class="ic-mach">${subIcon}${esc(sub)}</div>` : ''}
        <div class="ic-blocks">${blocks}</div>
      </div>
      <div class="ic-foot"><div class="ic-meta">${meta.join('')}</div>
        <div style="display:flex;gap:6px"><button class="ic-view" data-edit="${idx}">${SVG.edit}แก้ไข</button></div></div>
    </div>
    <div class="ic-side"><div class="ic-steps" style="--sc:${(MST[it.statusKey] || MST.other).color}">${names.map((s, k) =>
      `<div class="ic-step ${steps != null && k <= steps ? 'done' : ''} ${k === steps ? 'cur' : ''}"><i></i>${s}</div>`).join('')}</div></div>
  </article>`;
}

function planList(text) {
  const lines = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) return '<p><span class="muted">ยังไม่ได้บันทึกแผนการปรับปรุง</span></p>';
  return '<ul class="plan-list">' + lines.map(l => {
    let m = l.match(/^(short|long|mid)[\s-]*term\s*[-:–]?\s*/i);
    if (m) { const k = m[1].toLowerCase(); return `<li class="tagged"><span class="ptag ${k === 'long' ? 'long' : 'short'}">${esc(m[1][0].toUpperCase() + m[1].slice(1).toLowerCase())} term</span><span>${esc(l.slice(m[0].length))}</span></li>`; }
    m = l.match(/^(testing|test|ทดสอบ)/i);
    if (m) return `<li class="tagged"><span class="ptag test">ทดสอบ</span><span>${esc(l)}</span></li>`;
    return `<li><span>${esc(l)}</span></li>`;
  }).join('') + '</ul>';
}

function cardMedia(it, idx, src) {
  const n = it.photos.length;
  if (!n) return `<div class="ic-nophoto">${SVG.image}ไม่มีรูปประกอบ</div>`;
  const thumbs = it.photos.slice(1, 4);
  return `<div class="ic-media"><div class="ph ic-cover" data-src="${src}" data-open="${idx}" data-k="0"><img data-id="${esc(it.photos[0])}" alt="รูปที่ 1" loading="lazy"></div>
      <span class="ic-pcount">${SVG.camera}${n} รูป</span></div>` +
    (thumbs.length ? `<div class="ic-thumbs">` + thumbs.map((id, j) => {
      const k = j + 1, last = j === thumbs.length - 1 && n > 4;
      return `<div class="ph" data-src="${src}" data-open="${idx}" data-k="${k}"><img data-id="${esc(id)}" alt="รูปที่ ${k + 1}" loading="lazy">${last ? `<span class="more">+${n - 4}</span>` : ''}</div>`;
    }).join('') + `</div>` : '');
}

function markClamped() {
  document.querySelectorAll('.page:not([hidden]) p.clamp').forEach(p => {
    if (p.nextElementSibling && p.nextElementSibling.classList.contains('ic-more')) return;
    if (p.scrollHeight > p.clientHeight + 2) {
      const b = document.createElement('button');
      b.className = 'ic-more'; b.type = 'button'; b.textContent = 'ดูเพิ่มเติม';
      b.onclick = () => { const o = p.classList.toggle('open'); b.textContent = o ? 'ย่อ' : 'ดูเพิ่มเติม'; };
      p.after(b);
    }
  });
}

function renderStackChart(key, items, groupFn, canvasKey, onPick) {
  const L = LOGS[key], d = L.data, by = {};
  const gf = groupFn || (x => groupName(d, groupOf(d, x)));
  items.forEach(x => {
    const g = gf(x);
    by[g] = by[g] || { open: 0, progress: 0, closed: 0, rest: 0 };
    const k = x.statusKey; if (k === 'open' || k === 'progress' || k === 'closed') by[g][k]++; else by[g].rest++;
  });
  const ck = canvasKey || key;
  const names = Object.keys(by).sort((a, b) => { const t = n => by[n].open + by[n].progress + by[n].closed + by[n].rest; return t(b) - t(a) || a.localeCompare(b, 'th', { numeric: true }); }).slice(0, 25);
  const box = $(ck + 'Box'); if (box) box.style.height = Math.max(180, names.length * 40 + 60) + 'px';
  const ds = (k, label, color) => ({ label, data: names.map(m => by[m][k]), backgroundColor: color, borderColor: '#fff', borderWidth: { right: 2 }, borderRadius: 4, borderSkipped: false, maxBarThickness: 24 });
  const sets = [ds('open', stLabel('open', key), MST.open.color), ds('progress', MST.progress.label, MST.progress.color), ds('closed', MST.closed.label, MST.closed.color)];
  if (names.some(m => by[m].rest)) sets.push(ds('rest', 'อื่น ๆ / ไม่ระบุ', '#c3c2b7'));
  mkChart(L.chart, ck + 'Chart', { type: 'bar', data: { labels: names, datasets: sets },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { ...tooltipBase, mode: 'index', intersect: false, filter: c => c.parsed.x > 0, callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.x} รายการ`, footer: items => onPick ? `รวม ${names.length ? (n => by[n].open + by[n].progress + by[n].closed + by[n].rest)(names[items[0].dataIndex]) : 0} เคส · คลิกเพื่อดูเคส` : '' } } },
      ...(onPick ? { onClick: (e, els) => { if (els && els.length) { const nm = names[els[0].index]; setTimeout(() => onPick(nm), 0); } }, onHover: (e, els) => { if (e.native) e.native.target.style.cursor = els && els.length ? 'pointer' : 'default'; } } : {}),
      scales: { x: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#efeee9' }, border: { display: false } }, y: { stacked: true, grid: { display: false }, ticks: { font: { weight: '600' } } } } } });
}

/* =====================================================================
   SAFETY PATROL — ปฏิทินเดิน Patrol + Dashboard ผู้รายงาน
   ===================================================================== */
const PST = {
  done:     { label: 'เดินแล้ว',          cls: 'good',     icon: '✓', bg: 'var(--good-bg)' },
  today:    { label: 'วันนี้',             cls: 'warning',  icon: '!', bg: 'var(--warning-bg)' },
  upcoming: { label: 'แผน (ยังไม่ถึง)',    cls: 'info',     icon: '○', bg: 'rgba(42,120,214,.12)' },
  overdue:  { label: 'เลยกำหนด ยังไม่บันทึก', cls: 'critical', icon: '✕', bg: 'var(--critical-bg)' }
};
const pBadge = (st, text) => `<span class="badge s-${PST[st].cls}"><i>${PST[st].icon}</i>${esc(text || PST[st].label)}</span>`;
/** สรุปรายวัน: แผน / สิ่งที่พบ / สถานะของวัน */
function patrolDays(items) {
  const t = APP.boot.today, by = {};
  items.forEach(it => { if (!it.iso) return; (by[it.iso] = by[it.iso] || { iso: it.iso, plans: [], finds: [] })[it.plan ? 'plans' : 'finds'].push(it); });
  return Object.values(by).map(x => {
    x.state = x.finds.length ? 'done' : x.iso < t ? 'overdue' : x.iso === t ? 'today' : 'upcoming';
    x.reporters = [...new Set(x.plans.concat(x.finds).map(it => it.val.reporter).filter(Boolean))];
    return x;
  }).sort((a, b) => a.iso.localeCompare(b.iso));
}

function renderPatrol() {
  const L = LOGS.patrol, d = L.data; if (!d) return;
  L.dirty = false;
  if (!L.month) L.month = APP.boot.today.slice(0, 7);
  if (!L.sel || L.sel.slice(0, 7) !== L.month) L.sel = L.month === APP.boot.today.slice(0, 7) ? APP.boot.today : L.month + '-01';
  monthSelect('patrol');
  const q = keyOf(L.q), t = APP.boot.today;
  const monthAll = d.items.filter(it => it.iso && it.iso.slice(0, 7) === L.month);
  const repSel = $('page-patrol').querySelector('[data-g]'), gw = $('page-patrol').querySelector('[data-gwrap]');
  const reps = [...new Set(d.items.map(it => it.val.reporter).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
  gw.hidden = !reps.length;
  $('page-patrol').querySelector('[data-glabel]').textContent = 'ผู้รายงาน';
  repSel.innerHTML = `<option value="">ทุกคน</option>` + reps.map(r => `<option value="${esc(r)}" ${r === L.group ? 'selected' : ''}>${esc(r)} (${monthAll.filter(it => it.val.reporter === r && !it.plan).length})</option>`).join('');
  repSel.value = L.group;
  const inMonth = monthAll.filter(it => (!L.group || it.val.reporter === L.group) && matchQ(it, q));
  L.view = inMonth.slice().sort((a, b) => a.iso.localeCompare(b.iso) || (a.plan - b.plan) || a.row - b.row);
  const finds = L.view.filter(x => !x.plan);
  const days = patrolDays(L.view);
  const n = k => finds.filter(x => x.statusKey === k).length;
  const doneDays = days.filter(x => x.state === 'done').length, overdue = days.filter(x => x.state === 'overdue');
  const next = patrolDays(d.items.filter(it => !L.group || it.val.reporter === L.group)).find(x => x.iso >= t && x.state !== 'done');
  const carry = d.items.filter(it => !it.plan && it.iso && it.iso.slice(0, 7) < L.month && (it.statusKey === 'open' || it.statusKey === 'progress'));
  const closedPct = finds.length ? n('closed') / finds.length * 100 : 0;
  const period = thMonthFull(L.month);

  $('patrolApp').innerHTML = `
    ${d.missing.length ? `<div class="info mt">${SVG.info}<div>ชีต "${esc(d.sheetName)}" ไม่มีคอลัมน์ <b>${d.missing.map(esc).join(', ')}</b></div></div>` : ''}
    ${carry.length ? `<div class="info mt warnbox">${SVG.info}<div><b>สิ่งที่พบจากเดือนก่อนยังไม่ปิด ${carry.length} รายการ</b> — ${carry.slice(0, 4).map(it => esc(thDate(it.iso))).join(', ')}${carry.length > 4 ? ' …' : ''}</div></div>` : ''}
    <section class="grid mkpis mt">
      <div class="card kpi"><div class="lbl">${SVG.cal}วันเดิน Patrol · ${esc(period)}</div><div class="val num">${doneDays}<small>/ ${days.length} วัน</small></div><div class="bar"><i style="width:${days.length ? doneDays / days.length * 100 : 0}%;background:var(--good)"></i></div><div class="sub">เดินแล้ว / วันที่มีแผนหรือมีบันทึก</div></div>
      <div class="card kpi"><div class="lbl">${SVG.search}สิ่งที่พบ</div><div class="val num">${finds.length}<small>รายการ</small></div><div class="sub">${finds.reduce((s, x) => s + x.photos.length, 0)} รูป · ${new Set(finds.map(x => x.val.reporter).filter(Boolean)).size} ผู้รายงาน</div></div>
      <div class="card kpi"><div class="lbl">ยังไม่ปิด</div><div class="val num ${n('open') ? 'neg' : ''}">${n('open') + n('progress')}</div><div class="sub">${sBadge({ statusKey: 'open', status: '' }, 'patrol')} ${n('open')} · ${sBadge({ statusKey: 'progress', status: '' }, 'patrol')} ${n('progress')}</div></div>
      <div class="card kpi"><div class="lbl">ปิดแล้ว</div><div class="val num">${n('closed')}<small>/ ${finds.length}</small></div><div class="bar"><i style="width:${closedPct}%;background:var(--good)"></i></div><div class="sub">ปิดแล้ว ${closedPct.toFixed(0)}%</div></div>
      <div class="card kpi"><div class="lbl">${SVG.clock}Patrol ครั้งถัดไป</div>${next ? `<div class="val num" style="font-size:20px">${esc(thDate(next.iso))}</div><div class="sub">${next.iso === t ? '<b class="neg">วันนี้</b>' : 'อีก ' + daysBetween(t, next.iso) + ' วัน'}${next.reporters.length ? ' · ' + esc(next.reporters.join(', ')) : ''}</div>` : '<div class="val">–</div><div class="sub">ยังไม่มีแผน — กด “วางแผน Patrol”</div>'}
        ${overdue.length ? `<div class="sub neg">เลยกำหนด ${overdue.length} วัน ยังไม่บันทึกผล</div>` : ''}</div>
    </section>

    <section class="grid g-2-1 mt">
      <div class="card" id="calCard">${patrolCalendar(days)}</div>
      <div class="card"><div class="card-h"><div><h2>รายละเอียดวันที่เลือก</h2><p>คลิกวันในปฏิทินเพื่อดู / บันทึก</p></div></div><div class="card-b" id="pDetail">${patrolDetail()}</div></div>
    </section>

    <section class="grid g-2-1 mt">
      <div class="card"><div class="card-h"><div><h2>สิ่งที่พบแยกตามผู้รายงาน</h2><p>${esc(period)} · แบ่งตามสถานะการแก้ไข</p></div></div>
        <div class="clegend">${['open', 'progress', 'closed'].map(k => `<span><i class="sw" style="--c:${MST[k].color}"></i>${stLabel(k, 'patrol')}</span>`).join('')}</div>
        <div class="card-b">${finds.length ? `<div class="chartbox" id="patrolRepBox"><canvas id="patrolRepChart"></canvas></div>` : '<div class="empty">ยังไม่มีสิ่งที่พบในเดือนนี้</div>'}</div></div>
      <div class="card"><div class="card-h"><div><h2>สรุปสถานะ</h2><p>${esc(period)}${L.group ? ' · ' + esc(L.group) : ''}</p></div></div><div class="card-b">${statusList(finds, 'patrol')}</div></div>
    </section>
    <section class="card mt"><div class="card-h"><div><h2>ผู้รายงาน · ${esc(period)}</h2><p>จำนวนวันที่เดิน · สิ่งที่พบ · ความคืบหน้าการแก้ไข</p></div></div>
      <div class="card-b tbl-wrap">${reporterTable(L.view)}</div></section>

    <div class="card-h" style="padding:24px 2px 12px;align-items:center"><div><h2>สิ่งที่พบ · ${esc(period)}</h2><p>${finds.length} รายการ · คลิกรูปเพื่อดูขนาดเต็ม</p></div>${layoutSeg(L)}</div>
    <section class="igrid ${L.layout === 'list' ? 'list' : ''}">${finds.length ? finds.slice().sort((a, b) => ['open', 'progress', 'other', 'none', 'closed'].indexOf(a.statusKey) - ['open', 'progress', 'other', 'none', 'closed'].indexOf(b.statusKey) || b.iso.localeCompare(a.iso))
      .map(it => logCard('patrol', it, L.view.indexOf(it))).join('') : `<div class="card empty" style="padding:40px 20px">ยังไม่มีสิ่งที่พบในเดือน ${esc(period)}</div>`}</section>`;
  loadImgsIn('patrolApp');
  requestAnimationFrame(markClamped);
  if (finds.length) renderStackChart('patrol', finds, x => x.val.reporter || '(ไม่ระบุ)', 'patrolRep');
}

function patrolCalendar(days) {
  const L = LOGS.patrol, t = APP.boot.today;
  const [y, m] = L.month.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)), start = new Date(Date.UTC(y, m - 1, 1 - first.getUTCDay()));
  const by = {}; days.forEach(x => by[x.iso] = x);
  let cells = '';
  for (let k = 0; k < 42; k++) {
    const dt = new Date(start.getTime() + k * 864e5), iso = isoOf(dt);
    if (k === 35 && dt.getUTCMonth() !== m - 1) break;
    const x = by[iso];
    const evs = x ? [
      ...(x.finds.length ? [`<span class="ev" style="background:${PST.done.bg}"><i>✓</i><span>พบ ${x.finds.length}${x.finds.some(f => f.statusKey === 'open') ? ' · รอแก้' : ''}</span></span>`] : []),
      ...(!x.finds.length ? [`<span class="ev" style="background:${PST[x.state].bg}"><i>${PST[x.state].icon}</i><span>${esc(x.reporters.join(', ') || 'แผน Patrol')}</span></span>`] : []),
      ...(x.finds.length && x.reporters.length ? [`<span class="ev rep"><span>${esc(x.reporters.join(', '))}</span></span>`] : [])
    ].join('') : '';
    cells += `<div class="day ${dt.getUTCMonth() !== m - 1 ? 'out' : ''} ${iso === t ? 'today' : ''} has ${iso === L.sel ? 'sel' : ''}" data-iso="${iso}"><span class="dn">${dt.getUTCDate()}</span>${evs}</div>`;
  }
  return `<div class="cal-head"><div><h2>${TH_MONTH[m - 1]} ${beYear(y)}</h2><p style="margin:2px 0 0;font-size:12px;color:var(--ink-3)">${days.length} วันที่มีแผน/บันทึก · คลิกวันเพื่อดูหรือเพิ่ม</p></div>
      <div class="cal-nav"><button class="btn" data-cal="-1" title="เดือนก่อน">‹</button><button class="btn" data-cal="0">เดือนนี้</button><button class="btn" data-cal="1" title="เดือนถัดไป">›</button></div></div>
    <div class="clegend" style="padding:0 18px 8px">${Object.keys(PST).map(k => `<span>${pBadge(k)}</span>`).join('')}</div>
    <div class="cal">${['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map((x, i) => `<div class="dow ${i === 0 ? 'sun' : ''}">${x}</div>`).join('')}${cells}</div>`;
}

function patrolDetail() {
  const L = LOGS.patrol, t = APP.boot.today, iso = L.sel;
  const rows = L.view.filter(it => it.iso === iso);
  const x = patrolDays(rows)[0];
  const diff = daysBetween(t, iso);
  const head = `<div class="pd-date">${esc(thDate(iso, true))}</div>
    <div class="pd-sub">${x ? pBadge(x.state) : '<span class="badge s-na"><i>–</i>ไม่มีแผน</span>'} &nbsp;${diff > 0 ? 'อีก ' + diff + ' วัน' : diff === 0 ? 'วันนี้' : 'ผ่านมาแล้ว ' + (-diff) + ' วัน'}</div>
    <div class="pd-acts"><button class="btn primary" data-addf="${iso}">${SVG.plus}บันทึกสิ่งที่พบ</button><button class="btn" data-addp="${iso}">${SVG.cal}วางแผนวันนี้</button></div>`;
  if (!rows.length) return head + `<div class="ic-nophoto" style="margin:14px 0 0;height:110px">${SVG.cal}ยังไม่มีแผนหรือบันทึกของวันนี้</div>`;
  return head + rows.map(it => {
    const i = L.view.indexOf(it);
    if (it.plan) return `<div class="pd-item plan"><div><b>${SVG.user}${esc(it.val.reporter || 'ไม่ระบุผู้เดิน')}</b><div class="muted" style="font-size:12px">แผนเดิน Patrol · ยังไม่บันทึกผล</div></div>
      <button class="ic-view" data-edit="${i}">${SVG.edit}บันทึกผล</button></div>`;
    return `<div class="pd-item"><div style="min-width:0;flex:1"><div class="pd-top">${sBadge(it, 'patrol')}${it.val.reporter ? `<span class="muted">${SVG.user}${esc(it.val.reporter)}</span>` : ''}</div>
        <p class="clamp" style="margin:6px 0 0;font-size:13px;line-height:1.55;white-space:pre-wrap">${esc(it.val.evidence || '(ไม่มีคำอธิบาย)')}</p>

function compressImage(file, max = 1600, q = 0.82) {
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', q).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); const r = new FileReader(); r.onload = () => res({ mime: file.type || 'image/jpeg', data: String(r.result).split(',')[1] }); r.readAsDataURL(file); };
    img.src = url;
  });
}
async function saveLogForm() {

      });
    });
}
function dropPending(draft) { const P = LOGS[draft.key].pending || []; const i = P.indexOf(draft); if (i >= 0) P.splice(i, 1); }
async function runLogSave(draft) {
  const t0 = Date.now(), key = draft.key;
  // อัปโหลดรูปพร้อมกันครั้งละ 3 รูป (รูปที่อัปแล้วจะไม่อัปซ้ำถ้าต้องบันทึกใหม่)
  const todo = draft.photos.filter(p => p.file);
  const worker = async () => {
    for (let p = todo.find(x => x.file && !x.busy); p; p = todo.find(x => x.file && !x.busy)) {
      p.busy = true;
      try {
        const c = await compressImage(p.file);
        if (c.data.length * 0.75 > cfg().maxUpload) throw new Error(`รูป ${p.file.name} ใหญ่เกินไป`);
        const r = await writeCall('uploadPhoto', { module: key, name: p.file.name, mime: c.mime, data: c.data });
        p.id = r.id; delete p.file;
      } finally { delete p.busy; }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  const ids = draft.photos.map(p => p.id).filter(Boolean);
  if (!draft.uuid) draft.uuid = API.uuid();   // กันบันทึกซ้ำเมื่อกดลองใหม่
  const res = await writeCall('saveLog', { uuid: draft.uuid, module: key, row: draft.it ? draft.it.row : 0, sig: draft.it ? draft.it.sig : '', values: draft.values, photos: ids });
  return { res, t0 };
}
function pendingCards(key) {

}

const IMG_DATA = new Map();
const driveThumb = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
function serverImg(id) {
  if (!IMG_DATA.has(id)) {
    IMG_DATA.set(id, call('getDriveImage', id));
    IMG_DATA.get(id).catch(() => IMG_DATA.delete(id));
  }
  return IMG_DATA.get(id);
}
function loadImg(img, id, w) {
  const ph = img.closest('.ph');
  ph && ph.classList.remove('loaded', 'broken');
  img.onload = () => ph && ph.classList.add('loaded');
  img.onerror = () => {
    img.onerror = () => { ph && ph.classList.add('broken'); };
    serverImg(id).then(u => { img.src = u; }).catch(() => ph && ph.classList.add('broken'));
  };
  img.removeAttribute('src');
  img.src = driveThumb(id, w);
}
function loadImgsIn(rootId) {

  $('lbOpen').href = `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
  $('lbCap').innerHTML = `<b>${esc(LB.title)}</b>${LB.sub ? ' — ' + esc(LB.sub) : ''}<small>รูปที่ ${LB.i + 1} / ${n}</small>`;
  $('lbPrev').style.display = $('lbNext').style.display = n > 1 ? '' : 'none';
  $('lbThumbs').querySelectorAll('button').forEach(b => b.classList.toggle('on', Number(b.dataset.k) === LB.i));
}
function stepLB(d) { const n = LB.item.photos.length; LB.i = (LB.i + d + n) % n; showLB(); }
function closeLB() { $('lb').hidden = true; document.body.style.overflow = ''; }

/* =====================================================================
   Events + Boot
   ===================================================================== */
document.addEventListener('click', e => {
  const ph = e.target.closest('.ph[data-open]');
  if (ph && !ph.classList.contains('broken') && !ph.closest('#lb')) {
    const L = LOGS[ph.dataset.src]; if (!L) return;
    const it = L.view[Number(ph.dataset.open)];
    if (it && it.photos.length) { e.stopPropagation(); openLB(it, Number(ph.dataset.k) || 0, itemId(L.data, it) + ' · ' + (it.val[L.data.titleKey] || ''), (it.iso ? thDate(it.iso) : '') + (it.val.reporter ? ' · ' + it.val.reporter : '')); }
    return;
  }
  if (e.target.closest('[data-print]')) window.print();
  if (e.target.closest('[data-burger]')) { $('sidebar').classList.add('open'); $('scrim').classList.add('show'); }
}, true);
$('scrim').onclick = closeDrawer;
document.querySelectorAll('.nav-item').forEach(b => b.onclick = () => go(b.dataset.page));
$('lbClose').onclick = closeLB;
$('lbPrev').onclick = () => stepLB(-1);
$('lbNext').onclick = () => stepLB(1);
$('lbThumbs').onclick = e => { const b = e.target.closest('button'); if (b) { LB.i = Number(b.dataset.k); showLB(); } };
$('lb').onclick = e => { if (e.target.id === 'lb') closeLB(); };
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
$('mClose').onclick = closeModal;
document.addEventListener('keydown', e => {
  if (!$('dlg').hidden) { if (e.key === 'Escape') $('dCancel').click(); return; }
  if (!$('lb').hidden) { if (e.key === 'Escape') closeLB(); else if (e.key === 'ArrowLeft') stepLB(-1); else if (e.key === 'ArrowRight') stepLB(1); return; }
  if (!$('modal').hidden && e.key === 'Escape') closeModal();
});
let tx = null;
$('lb').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('lb').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) stepLB(dx < 0 ? 1 : -1); tx = null; });
window.addEventListener('beforeunload', e => { if (APP.dirty) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('beforeprint', () => { Object.values(A.charts).forEach(c => c && c.resize()); });

async function boot() {
  try {
    const me = await API.requireLogin();          // แสดงหน้าล็อกอินจนกว่าจะเข้าสู่ระบบสำเร็จ
    APP.user = me.display_name;
    APP.boot = await call('getBoot', { sheet: store.get('smc_last_sheet') || '' });
  } catch (e) {
    $('bootMsg').innerHTML = errHtml('เชื่อมต่อฐานข้อมูลไม่สำเร็จ', e, 'location.reload()');
    return;
  }
  $('boot').remove();
  if (APP.boot.config.logo) $('logo').src = APP.boot.config.logo;
  renderUser();
  buildEntryShell(); buildAchShell(); buildMasterShell();
  Object.keys(LOGS).forEach(buildLogShell);
  if (APP.boot.warnings.length) $('sbWarn').innerHTML = `<details><summary>${badge('warning', 'ข้อควรตรวจสอบ ' + APP.boot.warnings.length)}</summary><ul>${APP.boot.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></details>`;
  let first = 'entry';
  try {
    const p = new URLSearchParams(location.search).get('page'); if (PAGES.indexOf(p) >= 0) first = p;
  } catch (e) { /* ignore */ }
  // หน้าบันทึกของไลน์ล่าสุดมากับ getBoot แล้ว ไม่ต้องเรียกซ้ำ
  if (APP.boot.entry) { E.sheet = APP.boot.entry.sheet; E.iso = APP.boot.entry.iso; $('eSheet').value = E.sheet; $('eDate').value = E.iso; applyEntry(APP.boot.entry); }
  go(first);
  if (APP.boot.entry) loadDayStatus();
  // ทั้ง 4 เมนูติดตามงานในการเรียกครั้งเดียว (badge บนเมนู) — รอให้หน้าแรกขึ้นก่อน
  setTimeout(() => { if (!LOGS_ALL && Object.keys(LOGS).some(k => !LOGS[k].data)) loadAllLogs(); }, 600);
}
window.__chartReady.then(ok => {
  if (!ok) { CHART_FAILED = true; document.querySelectorAll('.chartbox').forEach(b => { if (!b.id) b.id = 'cb_' + Math.random().toString(36).slice(2); noChart(b.id); }); return; }
  setupCharts();
  if (A.data && APP.page === 'achieve') renderAch();
  Object.keys(LOGS).forEach(k => { if (LOGS[k].data && APP.page === k) rerender(k); });
});
boot();

</script>
</body>
</html>
