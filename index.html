<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMC Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
/* ดัก error ทุกชนิด: แสดงสาเหตุบนหน้าจอแทนการหมุนค้าง */
window.__BUILD = 'SMC-APP Web v4.0 (Supabase)';
window.__errs = [];
window.__showFatal = function () {
  var o = document.getElementById('bootMsg');
  if (!o) { o = document.createElement('div'); o.id = 'bootMsg'; o.className = 'bootbox'; (document.body || document.documentElement).appendChild(o); }
  var b = document.getElementById('boot'); if (b) b.style.display = 'flex';
  var esc = function (m) { return String(m).replace(/[&<>]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); };
  o.innerHTML = '<b style="color:#d03b3b">หน้าเว็บทำงานไม่สำเร็จ</b> <span style="font-size:11px;color:#86857f">' + esc(window.__BUILD) + '</span><br><span style="font-size:12px">' +
    window.__errs.map(esc).join('<br>') + '</span><br><span style="font-size:11.5px;color:#86857f">แคปหน้าจอนี้ส่งให้ผู้ดูแลระบบ</span><br><button class="btn" style="margin-top:8px" onclick="location.reload()">โหลดใหม่</button>';
};
window.addEventListener('error', function (e) {
  if (e && e.message) { window.__errs.push(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); window.__showFatal(); }
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); window.__showFatal();
});
</script>
<script>
/* โหลด Chart.js แบบไม่บล็อกหน้า + มีแหล่งสำรอง ถ้า CDN ถูกบล็อก ยังใช้งานบันทึก/ตารางได้ */
window.__chartReady = new Promise(function (resolve) {
  var srcs = ['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js',
              'https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js',
              'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js'];
  var i = 0;
  (function next() {
    if (window.Chart) return resolve(true);
    if (i >= srcs.length) return resolve(false);
    var s = document.createElement('script'), done = false;
    var to = setTimeout(function () { if (!done) { done = true; next(); } }, 7000);
    s.onload = function () { if (done) return; done = true; clearTimeout(to); window.Chart ? resolve(true) : next(); };
    s.onerror = function () { if (done) return; done = true; clearTimeout(to); next(); };
    s.src = srcs[i++]; document.head.appendChild(s);
  })();
});
</script>
<style>
:root{
  --page:#f4f5f2; --surface:#ffffff; --surface-2:#fcfcfb; --border:#e3e2dc; --border-2:#efeee9;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#86857f;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --brand-red:#e30613; --brand-yellow:#ffe500; --brand-green:#2e8b3a;
  --plan:#c3c2b7; --actual:#2a78d6;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-bg:rgba(12,163,12,.12); --warning-bg:rgba(250,178,25,.22); --serious-bg:rgba(236,131,90,.20); --critical-bg:rgba(208,59,59,.14);
  --radius:14px; --shadow:0 1px 2px rgba(16,16,16,.04),0 4px 16px rgba(16,16,16,.04);
  --font:'Inter','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.brandbar{height:4px;background:linear-gradient(90deg,var(--brand-red) 0 40%,var(--brand-yellow) 40% 70%,var(--brand-green) 70% 100%)}
header{position:sticky;top:4px;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hwrap{max-width:1480px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--border-2);padding:3px}
.htitle{flex:1;min-width:260px}
.htitle h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.htitle p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.hactions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--ink);cursor:pointer;font-weight:500;transition:.15s}
.btn:hover{background:#f6f6f3;border-color:var(--axis)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2b2b2a}
.btn svg{width:16px;height:16px}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Filter bar ---------- */
.filters{max-width:1480px;margin:0 auto;padding:10px 24px 12px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fgroup{display:flex;flex-direction:column;gap:4px}
.fgroup label{font-size:11.5px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.ctrl{height:34px;border:1px solid var(--border);border-radius:9px;padding:0 10px;background:#fff;color:var(--ink);outline:none}
.ctrl:focus{border-color:var(--actual);box-shadow:0 0 0 3px rgba(42,120,214,.15)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:500;user-select:none;transition:.15s;color:var(--ink-2)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{border-color:var(--ink);color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.chip:not(.on){opacity:.6}
.chip:not(.on) .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.chip.all{font-size:12px}
.toggle{display:inline-flex;align-items:center;gap:8px;height:34px;cursor:pointer;color:var(--ink-2);user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--ink)}

/* ---------- Layout ---------- */
main{max-width:1480px;margin:0 auto;padding:18px 24px 40px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.mt{margin-top:16px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g-2-1{grid-template-columns:1fr}}
@media (max-width:760px){header{position:static}.htitle h1{font-size:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g-1-1{grid-template-columns:1fr}.hwrap,.filters,main{padding-left:14px;padding-right:14px}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 6px}
.card-h h2{margin:0;font-size:14.5px;font-weight:600}
.card-h p{margin:3px 0 0;font-size:12px;color:var(--ink-3)}
.card-b{padding:8px 18px 16px}
.chartbox{position:relative;height:300px}
.chartbox.sm{height:260px}

/* ---------- KPI ---------- */
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .lbl svg{width:15px;height:15px;color:var(--ink-3)}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi .val small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:4px}
.kpi .sub{font-size:12px;color:var(--ink-3)}
.bar{height:6px;border-radius:99px;background:var(--border-2);overflow:hidden;position:relative;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.bar .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2)}
.pos{color:#006300}.neg{color:#b42323}

/* ---------- Status badge ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--ink)}
.badge i{font-style:normal;font-size:11px}
.s-good{background:var(--good-bg)} .s-good i{color:var(--good)}
.s-warning{background:var(--warning-bg)} .s-warning i{color:#9a6a00}
.s-serious{background:var(--serious-bg)} .s-serious i{color:#b5521f}
.s-critical{background:var(--critical-bg)} .s-critical i{color:var(--critical)}
.s-over{background:var(--serious-bg)} .s-over i{color:#b5521f}
.s-unplan{background:var(--serious-bg)} .s-unplan i{color:#b5521f}
.s-na,.s-off{background:#f1f0ec;color:var(--ink-3)}

/* ---------- Integrity banner ---------- */
.integrity{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--ink-2)}
.integrity b{color:var(--ink)}
.integrity details{width:100%}
.integrity summary{cursor:pointer;color:var(--ink-2)}
.integrity ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border-2)}
th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11.5px;z-index:1}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tbody tr:hover td{background:#fafaf7}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--border)}
.lname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.lname .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.mini{display:inline-block;width:70px;height:6px;border-radius:99px;background:var(--border-2);vertical-align:middle;margin-left:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ink-2)}

/* heatmap */
.heat{max-height:620px}
.heat th.grp{text-align:center;border-bottom:1px solid var(--border)}
.heat td.hm{text-align:center;padding:5px 6px;min-width:96px}
.hm .cell{display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:5px 6px;line-height:1.25}
.hm .cell b{font-size:12.5px;display:inline-flex;gap:4px;align-items:center}
.hm .cell b i{font-style:normal;font-size:10.5px}
.hm .cell small{font-size:10.5px;color:var(--ink-2)}
tr.off td{color:var(--ink-3);background:repeating-linear-gradient(135deg,#fafaf8 0 6px,#f4f4f0 6px 12px)}
tr.off td.hm .cell{background:transparent}
.remark{max-width:220px;overflow:hidden;text-overflow:ellipsis;text-align:left!important;color:var(--ink-2)}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2)}

/* exceptions */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 8px}
.tab{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{font-variant-numeric:tabular-nums;margin-left:4px;opacity:.75}
.exlist{max-height:440px;overflow:auto;padding:0 18px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));column-gap:28px;align-content:start}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-2)}
.empty{grid-column:1/-1}
.ex .d{font-weight:600;font-size:12.5px;min-width:74px}
.ex .d small{display:block;color:var(--ink-3);font-weight:400;font-size:11px}
.ex .t{font-size:12.5px;min-width:0}
.ex .t .r{color:var(--ink-3);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex .v{text-align:right;font-size:12px;color:var(--ink-2)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

/* chart legend (HTML) */
.clegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:0 18px}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.clegend .ln{width:16px;height:0;border-top:2px dashed var(--c)}
.clegend .ln.solid{border-top-style:solid}

/* loading / error */
.overlay{position:fixed;inset:4px 0 0 236px;background:rgba(244,245,242,.75);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.overlay.hidden{display:none}
.loader{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ink-2)}
.loader .ring{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brand-red);animation:spin .9s linear infinite}
.errbox{max-width:560px;margin:60px auto;padding:22px;border-radius:var(--radius);background:#fff;border:1px solid var(--border);box-shadow:var(--shadow)}
.errbox h3{margin:0 0 8px;color:var(--critical)}
footer{max-width:1480px;margin:0 auto;padding:0 24px 30px;color:var(--ink-3);font-size:11.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* print */
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:11px}
  header{position:static;backdrop-filter:none}
  .filters .chips .chip:not(.on),.hactions,.toggle,.tabs{display:none!important}
  .card{box-shadow:none;break-inside:avoid}
  .heat,.exlist{max-height:none!important;overflow:visible!important}
  .kpis{grid-template-columns:repeat(5,1fr)!important}
  .g-2-1,.g-1-1{grid-template-columns:1fr 1fr!important}
}

/* =================== Sidebar layout =================== */
.brandbar{position:fixed;top:0;left:0;right:0;z-index:40}
.sidebar{position:fixed;top:4px;left:0;bottom:0;width:236px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:35;transition:transform .22s ease}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--border-2)}
.sb-brand b{display:block;font-size:15px;letter-spacing:.02em}
.sb-brand small{display:block;color:var(--ink-3);font-size:11.5px}
.sb-nav{padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.sb-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);font-weight:500;font-size:13.5px;cursor:pointer;text-align:left;position:relative;transition:.15s}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{background:#f4f4f0;color:var(--ink)}
.nav-item.active{background:#f1f0ec;color:var(--ink);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-red)}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:#f1f0ec;color:var(--ink-2)}
.nav-badge.alert{background:var(--critical);color:#fff}
.nav-badge:empty{display:none}
.sb-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border-2);font-size:11px;color:var(--ink-3);line-height:1.5}
.content{margin-left:236px;padding-top:4px;min-height:100vh}
.burger{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:#fff;align-items:center;justify-content:center;cursor:pointer;flex:none}
.burger svg{width:20px;height:20px}
.scrim{display:none}
.page[hidden]{display:none!important}
@media (max-width:960px){
  .sidebar{transform:translateX(-100%);box-shadow:0 10px 40px rgba(0,0,0,.18)}
  .sidebar.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(11,11,11,.35);z-index:30}
  .content{margin-left:0}
  .burger{display:inline-flex}
  .overlay{left:0!important}
}

/* =================== Machine Problem =================== */
.mkpis{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1200px){.mkpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.mkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.search{position:relative}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--ink-3)}
.search input{padding-left:32px;width:260px}
@media (max-width:760px){.search input{width:100%}.search{width:100%}}
.info{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;border:1px dashed var(--axis);background:#fff;font-size:12.5px;color:var(--ink-2)}
.info svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--actual)}
.stlist{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.strow{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
.strow .bar{margin:0;height:8px}
.strow .n{text-align:right;font-weight:600}
.strow .n small{color:var(--ink-3);font-weight:400}

.ph{position:relative;overflow:hidden;cursor:zoom-in;background:linear-gradient(100deg,#eeede8 30%,#f7f7f4 50%,#eeede8 70%) 0 0/300% 100%;animation:shimmer 1.4s linear infinite;min-height:0}
.ph.loaded{animation:none;background:#eeede8}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s,transform .35s}
.ph.loaded img{opacity:1}
.ph:hover img{transform:scale(1.04)}
.ph.broken{animation:none;background:#f4f4f0;cursor:default}
.ph.broken::after{content:"เปิดรูปไม่ได้";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--ink-3)}
@keyframes shimmer{to{background-position:-300% 0}}
/* ---------- Issue cards (Grid / List) ---------- */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
@media (max-width:760px){.igrid{grid-template-columns:1fr}}
.icard{position:relative;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s,border-color .2s}
.icard:hover{transform:translateY(-2px);border-color:#d6d5ce;box-shadow:0 2px 4px rgba(16,16,16,.05),0 14px 32px rgba(16,16,16,.09)}
/* media */
.ic-media{position:relative;padding:10px 10px 0}
.ic-cover{aspect-ratio:16/10;border-radius:11px}
.ic-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 10px 0}
.ic-thumbs .ph{aspect-ratio:4/3;border-radius:8px}
.ic-pcount{position:absolute;left:20px;bottom:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(11,11,11,.72);color:#fff;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;backdrop-filter:blur(4px);pointer-events:none}
.ic-pcount svg{width:13px;height:13px}
.ic-nophoto{margin:10px 10px 0;height:96px;border-radius:11px;border:1.5px dashed var(--border);display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--ink-3);font-size:12px;background:#fbfbf9}
.ic-nophoto svg{width:22px;height:22px}
.ph .more{position:absolute;inset:0;background:rgba(11,11,11,.55);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
/* body */
.ic-body{padding:14px 16px 4px;display:flex;flex-direction:column;gap:10px;flex:1}
.ic-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ic-id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:600;color:var(--ink-2);background:#f1f0ec;border:1px solid var(--border-2);border-radius:6px;padding:2px 7px;letter-spacing:.02em}
.ic-title{margin:0;font-size:15.5px;font-weight:700;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic-mach{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);font-weight:500;margin-top:-4px}
.ic-mach svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.ic-block{border-radius:10px;padding:10px 12px;background:#f7f8fa;border:1px solid #edf0f4}
.ic-block.fix{background:#f3f8f3;border-color:#e2eee2}
.ic-block.cause{background:#fdf8f0;border-color:#f3e8d6}
.ic-block h4{margin:0 0 4px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.ic-block h4 svg{width:14px;height:14px}
.ic-block.fix h4 svg{color:#1c7a1c}
.ic-block.cause h4 svg{color:#9a6a00}
.ic-block p{margin:0;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ic-block p.open{-webkit-line-clamp:unset;display:block}
.ic-block .muted{color:var(--ink-3);font-style:italic}
.ic-more{border:0;background:none;padding:2px 0 0;color:var(--actual);font-size:12px;font-weight:600;cursor:pointer}
/* status stepper */
.ic-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 16px 4px}
.ic-step{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:var(--ink-3);font-weight:500}
.ic-step i{height:4px;border-radius:99px;background:var(--border-2)}
.ic-step.done{color:var(--ink-2)}
.ic-step.done i{background:var(--sc)}
.ic-step.cur{color:var(--ink);font-weight:700}
/* footer */
.ic-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px 12px;margin-top:8px;border-top:1px solid var(--border-2);font-size:11.5px;color:var(--ink-3)}
.ic-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ic-meta span{display:inline-flex;align-items:center;gap:5px}
.ic-meta svg{width:13px;height:13px}
.ic-view{border:1px solid var(--border);background:#fff;border-radius:8px;height:28px;padding:0 10px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.ic-view:hover{background:#f6f6f3}
.ic-view svg{width:14px;height:14px}
.ic-view[disabled]{opacity:.45;cursor:default}

/* view toggle */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;background:#fff;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--ink);color:#fff}

/* list layout */
.igrid.list{grid-template-columns:1fr;gap:12px}
.igrid.list .icard{display:grid;grid-template-columns:220px 1fr auto;grid-template-areas:"media body side"}
.igrid.list .icard:hover{transform:none}
.igrid.list .ic-mwrap{grid-area:media}
.igrid.list .ic-media{padding:10px 0 10px 10px}
.igrid.list .ic-cover{aspect-ratio:4/3}
.igrid.list .ic-thumbs{display:none}
.igrid:not(.list) .ic-nophoto{height:auto;aspect-ratio:16/10}
.igrid.list .ic-nophoto{margin:10px 0 10px 10px;height:calc(100% - 20px);min-height:110px}
.igrid.list .ic-main{grid-area:body;min-width:0;display:flex;flex-direction:column}
.igrid.list .ic-body{padding:12px 16px 6px}
.igrid.list .ic-blocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.igrid.list .ic-block p{-webkit-line-clamp:3}
.igrid.list .ic-foot{border-top:0;margin-top:auto;padding-top:4px}
.igrid.list .ic-side{grid-area:side;width:250px;border-left:1px solid var(--border-2);display:flex;flex-direction:column;justify-content:center}
.igrid.list .ic-steps{grid-template-columns:repeat(3,1fr);padding:12px 16px}
.igrid.list .ic-steps::before{content:"ความคืบหน้า";grid-column:1/-1;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-3);margin-bottom:2px}
@media (max-width:900px){
  .igrid.list .icard{grid-template-columns:140px 1fr;grid-template-areas:"media body" "side side"}
  .igrid.list .ic-side{width:auto;border-left:0;border-top:1px solid var(--border-2)}
  .igrid.list .ic-steps{grid-template-columns:repeat(3,1fr)}
  .igrid.list .ic-blocks{grid-template-columns:1fr}
}
.ic-blocks{display:flex;flex-direction:column;gap:8px}
.igrid:not(.list) .ic-main{display:contents}
.igrid:not(.list) .ic-mwrap{order:0}
.igrid:not(.list) .ic-body{order:1}
.igrid:not(.list) .ic-side{order:2}
.igrid:not(.list) .ic-foot{order:3}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(8,8,8,.92);display:flex;align-items:center;justify-content:center;flex-direction:column}
.lb[hidden]{display:none}
.lb figure{margin:0;max-width:min(1200px,92vw);max-height:80vh;display:flex;align-items:center;justify-content:center;position:relative}
.lb img{max-width:100%;max-height:80vh;border-radius:8px;object-fit:contain;opacity:0;transition:opacity .2s}
.lb .ph.loaded img{opacity:1}
.lb .ph{background:transparent;animation:none;cursor:default;min-width:120px;min-height:120px;display:flex;align-items:center;justify-content:center}
.lb .ph:not(.loaded)::before{content:"";width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .9s linear infinite;position:absolute}
.lb .ph:hover img{transform:none}
.lb-cap{color:#f0efec;margin-top:14px;text-align:center;font-size:13px;max-width:90vw}
.lb-cap small{display:block;color:#c3c2b7;margin-top:3px}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.lb-btn:hover{background:rgba(255,255,255,.25)}
.lb-btn svg{width:22px;height:22px}
.lb-prev{left:18px;top:50%;transform:translateY(-50%)}
.lb-next{right:18px;top:50%;transform:translateY(-50%)}
.lb-close{right:18px;top:18px}
.lb-open{position:absolute;left:18px;top:22px;color:#fff;font-size:12.5px;text-decoration:none;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:9px}
.lb-thumbs{display:flex;gap:6px;margin-top:12px}
.lb-thumbs button{width:52px;height:38px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#222;opacity:.6}
.lb-thumbs button.on{border-color:#fff;opacity:1}
.lb-thumbs .ph{cursor:pointer;width:100%;height:100%;min-width:0;min-height:0}
.lb-thumbs .ph::before{display:none}
.lb-thumbs img{opacity:1}

@media print{
  .sidebar,.scrim,.burger,.lb{display:none!important}
  .content{margin-left:0}
  .igrid{grid-template-columns:1fr 1fr}
  .icard{break-inside:avoid}
}

/* =================== Improvement / Patrol =================== */
.s-info{background:rgba(42,120,214,.12)} .s-info i{color:#2a78d6}
.plan-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.plan-list li{font-size:13px;line-height:1.55;display:flex;gap:8px;align-items:flex-start;word-break:break-word}
.plan-list li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:#1c7a1c;margin-top:8px}
.plan-list li.tagged::before{display:none}
.ptag{flex:none;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:1px;white-space:nowrap}
.ptag.short{background:#e8f1fc;color:#1b5fae}
.ptag.long{background:#f1ecfb;color:#5a45c4}
.ptag.test{background:#fff4dc;color:#8a5d00}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba .ic-block h4{font-size:10.5px}
.due-late{color:#b42323;font-weight:600}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--border-2);gap:2px}
.stack i{display:block;height:100%}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.cal-head h2{margin:0;font-size:16px}
.cal-nav{display:flex;gap:6px}
.cal-nav .btn{height:32px;padding:0 10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:4px 18px 18px}
.cal .dow{font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;padding:4px 0}
.cal .dow.sun{color:#b42323}
.cal .day{position:relative;min-height:78px;border:1px solid var(--border-2);border-radius:10px;padding:6px 7px;background:#fff;display:flex;flex-direction:column;gap:4px;transition:.15s}
.cal .day.out{background:#fafaf8;color:var(--ink-3);border-color:transparent}
.cal .day .dn{font-size:12px;font-weight:600}
.cal .day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cal .day.today .dn::after{content:" วันนี้";font-size:10px;font-weight:600;color:var(--brand-red)}
.cal .day.has{cursor:pointer}
.cal .day.has:hover{border-color:var(--axis);box-shadow:0 4px 12px rgba(16,16,16,.06)}
.cal .day.sel{border-color:var(--actual);box-shadow:0 0 0 2px rgba(42,120,214,.25)}
.cal .ev{font-size:10.5px;font-weight:600;border-radius:6px;padding:3px 6px;display:flex;gap:4px;align-items:center;line-height:1.2;color:var(--ink)}
.cal .ev i{font-style:normal}
@media (max-width:760px){.cal{gap:3px;padding:4px 8px 12px}.cal .day{min-height:52px;padding:4px}.cal .ev span{display:none}.cal .day.today .dn::after{content:""}}

.pd-date{font-size:18px;font-weight:700;margin:2px 0 4px}
.pd-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
.pgal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pgal .ph{aspect-ratio:4/3;border-radius:8px}
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-2);cursor:pointer}
.tl-row:last-child{border-bottom:0}
.tl-row:hover{background:#fafaf7}
.tl-date{text-align:center;border-radius:10px;border:1px solid var(--border);padding:6px 0;background:#fff}
.tl-date b{display:block;font-size:20px;line-height:1.1}
.tl-date small{font-size:10.5px;color:var(--ink-3)}
.tl-main{min-width:0}
.tl-main .t{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-main .s{font-size:12px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-thumbs{display:flex;gap:4px}
.tl-thumbs .ph{width:52px;height:40px;border-radius:6px}
/* =================== Web App additions =================== */
.page header{top:4px}
.hide-sm{}
@media (max-width:760px){.hide-sm{display:none!important}.btn .hide-sm{display:none}}
.muted{color:var(--ink-3)}
.hint{font-size:11.5px;color:var(--ink-3);margin:6px 0 0;line-height:1.5}
.wrap{white-space:normal!important}
.dim{opacity:.55;pointer-events:none;transition:opacity .2s}
.s-pend{background:#eef2f8} .s-pend i{color:#5b6f8e}
.btn.danger{background:var(--critical);border-color:var(--critical);color:#fff}
.btn.danger:hover{background:#b52f2f}
.btn.danger-o{color:#b42323;border-color:#efc9c9}
.btn.danger-o:hover{background:#fdf1f1}
.btn.sq{width:34px;padding:0;justify-content:center}
.btn.big{height:40px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.spin svg{animation:spin 1s linear infinite}
label.btn.disabled{opacity:.45;pointer-events:none}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#f4f4f0;color:var(--critical);border-color:var(--border)}
.icon-btn svg{width:16px;height:16px}
.linkbtn{border:0;background:none;color:var(--actual);font-weight:600;cursor:pointer;padding:0 0 0 4px;font-size:11.5px}
.datenav{display:flex;gap:6px;align-items:center}
.ekpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.ekpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* forms */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.fld label svg{width:15px;height:15px;color:var(--ink-3)}
.inp{height:38px;border:1px solid var(--border);border-radius:9px;padding:0 10px;background:#fff;color:var(--ink);outline:none;font-size:14px;width:100%;min-width:0}
textarea.inp{height:auto;padding:8px 10px;line-height:1.55;resize:vertical;font-family:inherit}
.inp:focus{border-color:var(--actual);box-shadow:0 0 0 3px rgba(42,120,214,.15)}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.inp.ro{background:#f6f6f3;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.fgrid .fld:not(.half){grid-column:1/-1}
@media (max-width:620px){.fgrid{grid-template-columns:1fr}}
.ferr{color:var(--critical);font-size:12.5px;white-space:pre-wrap;min-height:4px}
.fprog{color:var(--ink-2);font-size:12.5px}
.errlist{margin:0;padding-left:18px;line-height:1.7;color:var(--ink-2)}
.mprow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:4px 0 12px;border-bottom:1px dashed var(--border);margin-bottom:12px}
.mprow .fld{margin:0;width:190px}
.mprow .hint{margin:0 0 10px}

/* entry table */
.etbl-wrap{max-height:none}
.etbl{font-size:13px}
.etbl th{white-space:nowrap;vertical-align:bottom}
.etbl th small{display:block;font-weight:500;color:var(--ink-3);font-size:10.5px}
.etbl td{padding:5px 4px;vertical-align:middle}
.etbl th.c,.etbl td.c{text-align:center}
.etbl .rn{color:var(--ink-3);font-weight:600;width:30px}
.etbl .pcol{min-width:220px}
.etbl .inp{height:36px;font-size:13.5px}
.etbl .inp.num{width:96px}
.etbl .inp.sm{width:78px}
.etbl .inp.rmk{min-width:150px}
.etbl .lcol{max-width:90px;white-space:normal;line-height:1.25;font-size:10.5px}
.etbl .rpct{min-width:70px}
.etbl tbody tr:hover td{background:transparent}
.etbl tbody tr:focus-within td{background:#f7faff}
.eactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:14px}
@media (max-width:760px){.etbl .pcol{min-width:170px}.eactions .btn.big{width:100%;justify-content:center}}

/* day status */
.dgroup{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.dgroup b{font-size:12px;color:var(--ink-2)}
.dchip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid transparent;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit}
.dchip i{font-style:normal;font-size:11px}
.dchip small{font-weight:500;color:var(--ink-2)}
.dchip.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dchip.s-good i{color:var(--good)} .dchip.s-warning i{color:#9a6a00}
.legend .dchip{cursor:default;padding:2px 9px;font-size:11px}

/* loss tags */
.ltag{display:inline-flex;gap:4px;align-items:baseline;background:#f6f6f3;border:1px solid var(--border-2);border-radius:7px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}

/* sidebar user */
.sb-user{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.sb-user svg{width:15px;height:15px;flex:none}
.sb-user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#sbWarn{margin-bottom:8px}
#sbWarn summary{cursor:pointer;list-style:none}
#sbWarn ul{margin:6px 0 0;padding-left:16px;font-size:11px}

/* modal */
.modal{position:fixed;inset:0;z-index:70;background:rgba(11,11,11,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto;backdrop-filter:blur(2px)}
.modal[hidden]{display:none}
.modal.dlg{z-index:80;align-items:center}
.mbox{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);display:flex;flex-direction:column}
.modal.wide .mbox{width:min(760px,100%)}
.mbox.sm{width:min(420px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 8px}
.mhead h3{margin:0;font-size:16px}
.mbody{padding:8px 20px 6px}
.mfoot{display:flex;gap:8px;align-items:center;padding:12px 20px 16px;border-top:1px solid var(--border-2);margin-top:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pthumb{position:relative;aspect-ratio:1/1;border-radius:9px;cursor:default}
.pthumb .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(11,11,11,.65);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pthumb .rm svg{width:13px;height:13px}
.pthumb .new{position:absolute;left:4px;bottom:4px;background:var(--actual);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px}
.picbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#0b0b0b;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:min(420px,90vw);transition:opacity .4s,transform .4s}
.toast.err{background:var(--critical)}
.toast.out{opacity:0;transform:translateY(8px)}

/* boot */
.bootwrap{position:fixed;inset:4px 0 0 236px;display:flex;align-items:center;justify-content:center;background:var(--page);z-index:50}
.bootbox{text-align:center;max-width:92vw}
@media (max-width:960px){.bootwrap{left:0}}
footer{max-width:1480px}

@media print{
  .modal,.toasts,.bootwrap,[data-add],.eactions{display:none!important}
}

/* =================== v2: Patrol / month filter =================== */
.warnbox{border-color:#f0c56b;background:#fffbf0}
.warnbox svg{color:#b07b00}
.pd-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pd-item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-2)}
.pd-item.plan{align-items:center;background:repeating-linear-gradient(135deg,#fafaf8 0 6px,#f6f6f2 6px 12px);border-radius:10px;padding:10px 12px;margin-top:10px;border:1px dashed var(--border)}
.pd-item b{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.pd-item svg{width:14px;height:14px;vertical-align:-2px}
.pd-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.pd-top .muted{display:inline-flex;gap:4px;align-items:center}
.pd-fix{margin-top:6px;font-size:12.5px;color:#1c5f1c;background:#f3f8f3;border:1px solid #e2eee2;border-radius:8px;padding:6px 9px;display:flex;gap:6px;white-space:pre-wrap}
.pd-fix svg{flex:none;margin-top:2px}
#pDetail{max-height:620px;overflow:auto}
.cal .ev.rep{background:transparent;color:var(--ink-3);font-weight:500;padding:0 6px}
.cal .day{cursor:pointer}
.datenav select.ctrl{min-width:170px}

/* =================== v2.5: หลายหน่วยในกลุ่มเดียว =================== */
.ulist{display:flex;flex-direction:column;gap:2px}
.kpi .val.v2{font-size:20px}
.kpi .val.v2 .badge{font-size:10.5px;vertical-align:3px;margin-left:4px}

.s-over{background:var(--good-bg)} .s-over i{color:var(--good)}

/* =================== v2.8: เจาะลึก Dashboard =================== */
.crumbs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;position:sticky;top:150px;z-index:15;box-shadow:var(--shadow)}
@media (max-width:760px){.crumbs{top:4px}}
.crumbs nav{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs a{color:var(--actual);cursor:pointer;font-weight:600}
.crumbs a:hover{text-decoration:underline}
.crumbs b{color:var(--ink)}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dhead p{margin:0;color:var(--ink-3);font-size:12.5px;flex:1;min-width:200px}
tr.click{cursor:pointer}
tr.click:hover td{background:#f3f7fd!important}
td.click,th.click{cursor:pointer}
td.hm.click:hover .cell{outline:2px solid var(--actual);outline-offset:-2px}

.plink{color:var(--actual);cursor:pointer;text-decoration:underline dotted}
.remlist{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.clickhint{display:flex;gap:6px;align-items:center;margin:10px 2px 0}
.clickhint svg{width:14px;height:14px;color:var(--actual)}
.dimchips{opacity:.55}
.btn[disabled]{opacity:.4}

.clegend .pd{width:20px;height:0;border-top:2px dashed var(--c);position:relative;display:inline-block}
.clegend .pd::after{content:"";position:absolute;left:6px;top:-5px;width:6px;height:6px;border-radius:50%;background:#fff;border:2px solid var(--c)}
.chip.nodata{opacity:.5;border-style:dashed}
.chip small{font-size:10px;color:var(--ink-3);font-weight:600}

/* =================== v3.0: % Defect แยกประเภท =================== */
small.tpct{color:var(--bad,#d03b3b);font-weight:600;font-size:11px}
b.tp{color:var(--bad,#d03b3b)}
.typesum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:12.5px}
h4.subh{margin:0 0 6px;font-size:12px;color:var(--ink-2);font-weight:600}

.owntbl tr.sel td{background:#eef4fc!important}
.caselist{font-size:12px;line-height:1.55;min-width:260px;max-width:520px}
.caselist div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.owner-chip{font-size:12px;vertical-align:middle;cursor:pointer;margin-left:6px}
.owner-chip svg{width:13px;height:13px}

/* =================== v3.2: บันทึกเบื้องหลัง =================== */
@keyframes spin360{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(42,120,214,.25);border-top-color:#2a78d6;border-radius:50%;animation:spin360 .8s linear infinite;flex:none}
.spinner.sm{width:11px;height:11px;border-width:2px;margin-right:4px;vertical-align:-1px}
.bgsave{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:120;display:flex;gap:10px;align-items:center;background:#1f1e1c;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:min(92vw,520px)}
.bgsave[hidden]{display:none}
.bgsave b{font-size:13px;display:block}
.bgsave small{font-size:11.5px;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.bgsave .spinner{border-color:rgba(255,255,255,.25);border-top-color:#fff}
.toast.act{display:flex;align-items:center;gap:10px;max-width:min(92vw,560px)}
.toast.act span{flex:1}
.toast.act .btn{background:#fff;color:#1f1e1c;border:0;padding:5px 10px;font-size:12px;white-space:nowrap}
.toast.act .x{background:none;border:0;color:inherit;opacity:.7;cursor:pointer;font-size:14px}
.icard.pending{opacity:.75;border:1.5px dashed #9bbbe6;background:#f6f9fe}
.icard.pending .ic-body{padding:14px}
.icard.pending h3{margin:8px 0 6px;font-size:15px}
.pthumbs{display:flex;gap:6px}
.pthumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px}


/* =================== Login (Supabase) =================== */
.login{position:fixed;inset:0;z-index:100;background:var(--page);display:flex;align-items:center;justify-content:center;padding:20px}
.login[hidden]{display:none}

<script>
/* ======================= API — Supabase + Drive Gateway ======================= */
/* =====================================================================
   SMC Production — api.js
   แทน google.script.run: แต่ละฟังก์ชันคืนข้อมูล "shape เดียวกับ รหัส.gs เดิม" → app.js แทบไม่ต้องแก้
   - ข้อมูลทั้งหมด → Supabase (ล็อกอิน + RLS)
   - รูปภาพ → Google Drive ผ่าน GAS Drive Gateway (แนบ JWT ทุกครั้ง)
   - สูตร Dashboard (summarize_ / getDashboard) ยกมาจาก รหัส.gs เดิม เพื่อให้ตัวเลขตรงกัน
   ===================================================================== */
'use strict';
(function () {
  const C = window.SMC_CONFIG || {};
  if (!window.supabase || !window.supabase.createClient) throw new Error('โหลด supabase-js ไม่สำเร็จ (ตรวจอินเทอร์เน็ต)');
  if (!C.SUPABASE_URL || !C.SUPABASE_KEY || /xxxx/.test(C.SUPABASE_URL)) throw new Error('ยังไม่ได้ตั้งค่า SUPABASE_URL / SUPABASE_KEY ใน config.js');
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'smc_auth' }
  });

  const CONFIG = {
    APP_TITLE: 'SMC Production',
    LOGO_URL: 'https://raw.githubusercontent.com/chakkawan01702-commits/Logo-smc/main/SMC_favicon_128.png',
    TARGET_PCT: 95, WARN_PCT: 90, OVER_PCT: 150,
    MAX_ROWS_PER_DAY: 60, MAX_RANGE_DAYS: 400,

  };
  const SLOTS = Object.assign({ machine: 4, improve: 4, patrol: 4, brc: 4 }, C.PHOTO_SLOTS || {});

  /** เมนูติดตามงาน — ชื่อฟิลด์ (k) เหมือน รหัส.gs เดิม · col = คอลัมน์ในตาราง track_items */
  const MODULES = {
    machine: {
      title: 'Machine Problem', prefix: 'MP', titleKey: 'problem', subKey: 'machine', groupKey: 'machine', groupLabel: 'เครื่องจักร', monthly: true,
      statuses: ['Open', 'On progress', 'Done'],
      fields: [
        { k: 'date', col: 'item_date', label: 'วันที่', type: 'date', req: true },
        { k: 'machine', col: 'machine', label: 'เครื่องจักร', type: 'text', req: true, list: true },
        { k: 'problem', col: 'title', label: 'ปัญหา', type: 'textarea', req: true },
        { k: 'cause', col: 'cause', label: 'สาเหตุ', type: 'textarea' },
        { k: 'solution', col: 'solution', label: 'การแก้ไข', type: 'textarea' },
        { k: 'owner', col: 'owner', label: 'ผู้รับผิดชอบ', type: 'text', list: true },
        { k: 'status', col: 'status', label: 'สถานะ', type: 'status' }
      ]
    },
    improve: {
      title: 'Improvement Project', prefix: 'IP', titleKey: 'improvement', subKey: '', groupKey: '', groupLabel: '', monthly: false,
      statuses: ['Plan', 'On progress', 'Done'],
      fields: [
        { k: 'no', col: 'item_no', label: 'No.', type: 'no' },
        { k: 'improvement', col: 'title', label: 'หัวข้อการปรับปรุง', type: 'text', req: true },
        { k: 'solution', col: 'solution', label: 'แผนการปรับปรุง (1 บรรทัด = 1 ข้อ)', type: 'textarea' },
        { k: 'owner', col: 'owner', label: 'ผู้รับผิดชอบ', type: 'text', list: true },
        { k: 'implement', col: 'status', label: 'สถานะ (Implement)', type: 'status' }
      ]
    },
    patrol: {
      title: 'Safety Patrol', prefix: 'SP', titleKey: 'evidence', subKey: 'reporter', groupKey: 'reporter', groupLabel: 'ผู้รายงาน', monthly: true,
      statuses: ['Open', 'On progress', 'Done'],
      fields: [
        { k: 'date', col: 'item_date', label: 'วันที่ Patrol', type: 'date', req: true },
        { k: 'reporter', col: 'reporter', label: 'ผู้รายงาน / ผู้เดิน Patrol', type: 'text', list: true },
        { k: 'evidence', col: 'title', label: 'สิ่งที่พบ (Evidence)', type: 'textarea' },
        { k: 'solution', col: 'solution', label: 'การแก้ไข', type: 'textarea' },
        { k: 'status', col: 'status', label: 'สถานะ', type: 'status' }
      ]
    },
    brc: {
      title: 'BRC Issue', prefix: 'BRC', titleKey: 'issue', subKey: 'line', groupKey: 'line', groupLabel: 'ไลน์', monthly: true,
      statuses: ['Open', 'On progress', 'Done'],
      fields: [
        { k: 'date', col: 'item_date', label: 'วันที่พบ', type: 'date', req: true },
        { k: 'line', col: 'line_area', label: 'ไลน์ / พื้นที่', type: 'text', list: true },
        { k: 'owner', col: 'owner', label: 'ผู้รับผิดชอบ (Person in charge)', type: 'text', list: true },
        { k: 'issue', col: 'title', label: 'ประเด็น (Issue)', type: 'textarea', req: true },
        { k: 'solution', col: 'solution', label: 'การแก้ไข', type: 'textarea' },
        { k: 'status', col: 'status', label: 'สถานะ', type: 'status' }
      ]
    }
  };

  /* ---------------- ตัวช่วย ---------------- */
  const norm_ = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const keyOf_ = s => norm_(s).toLowerCase();
  const numOrNull_ = v => { if (v == null || v === '') return null; const n = Number(v); return isFinite(n) ? n : null; };
  const isoTh_ = iso => { const p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + (Number(p[0]) + 543); };
  const bkk = (d, opt) => new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: 'Asia/Bangkok' }, opt)).format(d || new Date());
  const todayIso = () => bkk(new Date(), { year: 'numeric', month: '2-digit', day: '2-digit' });
  const stamp = () => { const d = new Date(); return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(d).replace(',', ''); };
  const thaiDow_ = iso => { const p = String(iso).split('-').map(Number); return ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'][new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()]; };
  function isoRange_(from, to) {
    const out = [], a = from.split('-').map(Number), b = to.split('-').map(Number);
    let t = Date.UTC(a[0], a[1] - 1, a[2]); const end = Date.UTC(b[0], b[1] - 1, b[2]);
    while (t <= end && out.length <= CONFIG.MAX_RANGE_DAYS + 1) { out.push(new Date(t).toISOString().slice(0, 10)); t += 86400000; }
    return out;
  }
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

  function thrown(error) {
    let m = (error && (error.message || error.error_description)) || String(error);
    if (/JWT expired|invalid JWT|not authenticated/i.test(m)) m = 'หมดเวลาการเข้าสู่ระบบ — กรุณาเข้าสู่ระบบใหม่';
    if (/permission denied|row-level security/i.test(m)) m = 'ไม่มีสิทธิ์ทำรายการนี้';
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) m = 'เชื่อมต่ออินเทอร์เน็ตไม่ได้ — ตรวจสัญญาณแล้วลองใหม่';
    return new Error(m);
  }
  async function rpc(fn, args) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) throw thrown(error);
    return data;
  }
  /** อ่านทั้งตาราง (แบ่งหน้า 1,000 แถว — ไม่ติดลิมิตของ Supabase) */
  async function selectAll(table, cols, build) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      let q = sb.from(table).select(cols).range(from, from + 999);
      if (build) q = build(q);
      const { data, error } = await q;
      if (error) throw thrown(error);
      out.push(...data);
      if (data.length < 1000) return out;
    }
  }

  /* ---------------- ล็อกอิน ---------------- */
  let ME = null;
  async function loadMe() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    const { data, error } = await sb.from('profiles').select('username, display_name, role, active').eq('id', session.user.id).maybeSingle();
    if (error) throw thrown(error);
    if (!data || !data.active) { await sb.auth.signOut(); throw new Error('บัญชีนี้ถูกปิดการใช้งาน หรือยังไม่มีสิทธิ์เข้าใช้'); }
    return (ME = data);
  }
  function loginForm(msg) {
    return new Promise(resolve => {
      const box = document.getElementById('login');
      box.hidden = false;
      const f = document.getElementById('lgForm'), err = document.getElementById('lgErr'), btn = document.getElementById('lgBtn');
      err.textContent = msg || '';
      document.getElementById('lgUser').focus();
      f.onsubmit = async e => {
        e.preventDefault();
        const u = document.getElementById('lgUser').value.trim().toLowerCase(), p = document.getElementById('lgPass').value;
        if (!u || !p) { err.textContent = 'กรุณากรอก Username และ Password'; return; }
        btn.disabled = true; err.textContent = ''; btn.textContent = 'กำลังเข้าสู่ระบบ…';
        try {
          const email = u.indexOf('@') >= 0 ? u : u + '@' + (C.EMAIL_DOMAIN || 'smc.com');
          const { error } = await sb.auth.signInWithPassword({ email, password: p });
          if (error) throw new Error(/invalid/i.test(error.message) ? 'Username หรือ Password ไม่ถูกต้อง' : thrown(error).message);
          const me = await loadMe();
          document.getElementById('lgPass').value = '';
          box.hidden = true; resolve(me);
        } catch (ex) { err.textContent = ex.message; }
        finally { btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; }
      };
    });
  }
  async function requireLogin() {
    let me = null, msg = '';
    try { me = await loadMe(); } catch (e) { msg = e.message; }
    if (me) return me;
    document.getElementById('boot').style.display = 'none';
    me = await loginForm(msg);
    document.getElementById('boot').style.display = '';
    return me;
  }
  async function signOut() { try { await sb.auth.signOut(); } finally { location.reload(); } }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && ME) { ME = null; location.reload(); } });

  /* ---------------- โครงสร้างไลน์ (แทน prodStruct_) ---------------- */
  let STRUCT = null, MASTER = null;
  const groupKeyOf_ = s => s.group || s.unit;
  function groupsOf_(st) {
    const keys = [];
    st.forEach(s => { const k = groupKeyOf_(s); if (keys.indexOf(k) < 0) keys.push(k); });
    const out = CONFIG.GROUPS.filter(g => keys.indexOf(g.key) >= 0).map(g => ({ key: g.key, label: g.label }));
    keys.forEach(k => { if (!out.some(g => g.key === k)) out.push({ key: k, label: 'หน่วย ' + k }); });
    return out;
  }
  async function loadStruct(force) {
    if (STRUCT && !force) return STRUCT;
    const [lines, losses] = await Promise.all([
      selectAll('lines', 'id, name, unit, group_key, has_sachet, has_remark, has_mp_plan, has_mp_actual, sort_order', q => q.eq('active', true).order('sort_order').order('id')),
      selectAll('line_loss_types', 'id, line_id, name, unit, sort_order', q => q.eq('active', true).order('sort_order').order('id'))
    ]);
    STRUCT = lines.map(l => ({
      id: Number(l.id), name: l.name, unit: l.unit, group: l.group_key,
      sachet: l.has_sachet ? 1 : -1, remark: l.has_remark ? 1 : -1, mpP: l.has_mp_plan ? 1 : -1, mpA: l.has_mp_actual ? 1 : -1,
      loss: losses.filter(x => Number(x.line_id) === Number(l.id)).map(x => ({ id: Number(x.id), name: x.name, unit: x.unit })), warn: []
    }));
    return STRUCT;
  }
  function findStruct_(name) {
    const s = (STRUCT || []).filter(x => x.name === name)[0];
    if (!s) throw new Error('ไม่พบไลน์ "' + name + '"');
    return s;
  }
  async function readMaster_(force) {
    if (MASTER && !force) return MASTER;
    const rows = await selectAll('products', 'id, item_no, name, sachet_per_ct, note', q => q.order('item_no', { nullsFirst: false }).order('id'));
    const items = rows.map(r => ({ row: r.id, no: r.item_no == null ? '' : String(r.item_no), name: r.name, sachet: r.sachet_per_ct, note: r.note || '' }));
    const map = {}; items.forEach(it => { map[keyOf_(it.name)] = it; });
    return (MASTER = { items, map });
  }
  const publicConfig_ = () => ({ appTitle: CONFIG.APP_TITLE, logo: CONFIG.LOGO_URL, target: CONFIG.TARGET_PCT, warn: CONFIG.WARN_PCT, over: CONFIG.OVER_PCT, maxRows: CONFIG.MAX_ROWS_PER_DAY, maxUpload: CONFIG.MAX_UPLOAD_BYTES });

  /* ---------------- BOOT ---------------- */
  async function getBoot(opt) {
    opt = opt || {};
    const t0 = Date.now();
    const [st, master] = await Promise.all([loadStruct(true), readMaster_(true)]);
    const warnings = [];
    if (!st.length) warnings.push('ยังไม่มีไลน์ในตาราง lines — ตั้งค่าไลน์ใน Supabase ก่อน');
    if (!C.GAS_URL || /xxxx/.test(C.GAS_URL)) warnings.push('ยังไม่ได้ตั้งค่า GAS_URL ใน config.js — อัปโหลด/แสดงรูปยังใช้ไม่ได้');
    const today = todayIso();
    const out = {
      config: publicConfig_(),
      groups: groupsOf_(st).map(g => ({ key: g.key, label: g.label, sheets: st.filter(s => groupKeyOf_(s) === g.key).map(s => s.name) })),
      sheets: st.map(s => ({ name: s.name, unit: s.unit, sachet: s.sachet >= 0, loss: s.loss.map(l => ({ name: l.name, unit: l.unit })) })),
      products: master.items.map(p => ({ name: p.name, sachet: p.sachet, note: p.note })),
      modules: Object.keys(MODULES).map(k => ({ key: k, title: MODULES[k].title })),
      pinRequired: false, today, warnings, fastApi: true, me: ME
    };
    const sheet = st.some(s => s.name === opt.sheet) ? opt.sheet : (st[0] ? st[0].name : '');
    if (sheet) { try { out.entry = await getEntry(sheet, today); } catch (e) { out.entryError = e.message; } }
    out.serverMs = Date.now() - t0;
    return out;
  }

  /* ---------------- ENTRY ---------------- */
  async function getEntry(sheetName, iso) {
    iso = String(iso || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new Error('วันที่ไม่ถูกต้อง');
    await loadStruct();
    const s = findStruct_(String(sheetName || ''));
    const d = await rpc('get_entry', { p_line_id: s.id, p_date: iso });
    const lossArr = m => s.loss.map(l => { const v = (m || {})[String(l.id)]; return v == null ? null : Number(v); });
    const rows = (d.rows || []).map(r => ({ product: r.product, sachet: numOrNull_(r.sachet), plan: numOrNull_(r.plan), act: numOrNull_(r.act), remark: r.remark || '', loss: lossArr(r.loss) }));
    return {
      sheet: s.name, unit: s.unit, iso,
      has: { sachet: s.sachet >= 0, remark: s.remark >= 0, mp: s.mpP >= 0 || s.mpA >= 0, mpP: s.mpP >= 0, mpA: s.mpA >= 0, sumLoss: false },
      loss: s.loss.map(l => ({ name: l.name, unit: l.unit })),
      rows, mpP: numOrNull_(d.mp_plan), mpA: numOrNull_(d.mp_actual), slots: rows.length,
      prev: { iso: d.prev && d.prev.date ? d.prev.date : '', rows: ((d.prev && d.prev.rows) || []).map(r => ({ product: r.product, sachet: numOrNull_(r.sachet), plan: numOrNull_(r.plan) })) },
      recent: d.recent || [], warn: s.warn
    };
  }

  async function saveEntry(p) {
    p = p || {};
    const T0 = Date.now();
    await loadStruct();
    const s = findStruct_(String(p.sheet || ''));
    const iso = String(p.iso || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new Error('วันที่ไม่ถูกต้อง');
    const rows = (Array.isArray(p.rows) ? p.rows : []).map(r => {
      const loss = {};
      s.loss.forEach((l, j) => { const v = (r.loss || [])[j]; if (v != null && v !== '') loss[String(l.id)] = v; });
      return { product: r.product || '', sachet: r.sachet, plan: r.plan, act: r.act, remark: r.remark || '', loss };
    });
    const res = await rpc('save_entry', { p_line_id: s.id, p_date: iso, p_mp_plan: p.mpP == null ? null : p.mpP, p_mp_actual: p.mpA == null ? null : p.mpA, p_rows: rows });
    const fresh = await getEntry(s.name, iso);      // ค่าที่บันทึกจริง (รวม Sachet/CT จาก Master)
    return {
      ok: true, rows: res.rows, appended: 0, ms: Date.now() - T0, savedAt: res.savedAt,
      saved: { rows: fresh.rows, mpP: fresh.mpP, mpA: fresh.mpA, slots: fresh.rows.length },
      day: { sheet: s.name, n: fresh.rows.filter(r => r.product).length, P: Number(res.P) || 0, A: Number(res.A) || 0, actN: res.actN }
    };
  }

  /* ---------------- สรุปผล (ยกมาจาก รหัส.gs: rowHasData_ / summarize_) ---------------- */
  function rowHasData_(x) {
    return !!(x.product || x.plan != null || x.act != null || x.remark || x.mpP != null || x.mpA != null || x.loss.some(v => v != null));
  }
  /** แปลงข้อมูลจาก get_entries → แถวแบบเดิม (Manpower = แถวพิเศษของวัน แทน "แถวแรกของวัน" ในชีต) */
  function rowsOf_(s, data) {
    const out = [];
    (data.entries || []).filter(e => Number(e.line_id) === s.id).forEach(e => out.push({
      iso: e.date, seq: e.seq, product: norm_(e.product), sachet: numOrNull_(e.sachet), plan: numOrNull_(e.plan), act: numOrNull_(e.act),
      remark: String(e.remark || '').trim(), mpP: null, mpA: null,
      loss: s.loss.map(l => numOrNull_((e.loss || {})[String(l.id)]))
    }));
    (data.manpower || []).filter(m => Number(m.line_id) === s.id).forEach(m => out.push({
      iso: m.date, seq: 0, product: '', sachet: null, plan: null, act: null, remark: '',
      mpP: s.mpP >= 0 ? numOrNull_(m.mp_plan) : null, mpA: s.mpA >= 0 ? numOrNull_(m.mp_actual) : null, loss: s.loss.map(() => null)
    }));
    return out;
  }
  function summarize_(s, rows, master) {
    const out = {};
    const isCT = s.unit === 'CT', isKg = s.unit === 'Kg', isSa = s.unit === 'Sachet';
    rows.forEach(function (x) {
      const m = x.iso.slice(0, 7);
      const M = out[m] || (out[m] = { d: {}, p: {}, w: [] });
      const D = M.d[x.iso] || (M.d[x.iso] = { P: 0, A: 0, n: 0, an: 0, mp: null, ma: null, le: 0, lk: 0, b: 0, r: '', lt: s.loss.map(() => 0) });
      if (x.mpP != null) D.mp = Math.max(D.mp || 0, x.mpP);
      if (x.mpA != null) D.ma = Math.max(D.ma || 0, x.mpA);
      if (!rowHasData_(x)) return;
      const plan = x.plan || 0, act = x.act || 0;
      if (x.product) D.n++;
      if (x.act != null) D.an++;
      D.P += plan; D.A += act;
      if (x.remark) D.r += (D.r ? ' | ' : '') + (x.product ? x.product + ': ' : '') + x.remark;
      if ((plan || act) && !x.product && M.w.length < 30) M.w.push(s.name + ' ' + isoTh_(x.iso) + ': มีตัวเลขแต่ไม่มีชื่อ Product');
      if ((plan < 0 || act < 0) && M.w.length < 30) M.w.push(s.name + ' ' + isoTh_(x.iso) + ': มีค่าติดลบ');
      let sachet = 1;
      if (isCT) { const mm = master[keyOf_(x.product)]; sachet = x.sachet || (mm && mm.sachet) || 0; }
      const mmx = master[keyOf_(x.product)];
      const conv = isCT ? (sachet || null) : isSa ? ((x.sachet || (mmx && mmx.sachet)) || null) : null;
      let eq = 0, kg = 0;
      s.loss.forEach(function (l, j) {
        const v = x.loss[j];
        if (v == null) return;
        D.lt[j] += v;
        if (l.unit === 'kg') kg += v;
        if (isKg) { if (l.unit === 'kg') eq += v; }
        else if (isSa) { if (l.unit === 'ซอง') eq += v; }
        else if (!isCT) { /* หน่วยอื่น (เช่น Batch) — ไม่คิด % Loss */ }
        else if (l.unit === 'ซอง') eq += v;
        else if (l.unit === 'ลัง') eq += v * sachet;
      });
      const noSachet = isCT && !sachet;
      if (noSachet && (act || eq) && M.w.length < 30) M.w.push(s.name + ' ' + isoTh_(x.iso) + ' "' + x.product + '": ไม่มี Sachet/CT (ไม่พบใน Product Master) — % Loss ของรายการนี้ไม่ถูกนับ');
      const base = isCT ? act * sachet : (isKg || isSa) ? act : 0;
      D.le += noSachet ? 0 : eq; D.lk += kg; D.b += noSachet ? 0 : base;
      if (x.product) {
        const P = M.p[x.iso] || (M.p[x.iso] = []);
        let e = null;
        for (let i = 0; i < P.length; i++) if (P[i][0] === x.product) { e = P[i]; break; }
        if (!e) { e = [x.product, 0, 0, 0, 0, 0, conv, s.loss.map(() => 0)]; P.push(e); }
        e[1] += plan; if (x.act != null) e[2] += plan; e[3] += act; e[4] += noSachet ? 0 : eq; e[5] += noSachet ? 0 : base;
        if (!e[6] && conv) e[6] = conv;
        s.loss.forEach((l, j) => { if (x.loss[j] != null) e[7][j] += x.loss[j]; });
      }
    });
    return out;
  }

  /* ---------------- DASHBOARD (ยกมาจาก getDashboard เดิม) ---------------- */
  async function getDashboard(groupKey, from, to, force) {
    const t0 = Date.now();
    const allSt = await loadStruct(!!force);
    const masterAll = await readMaster_(!!force);
    const groups = groupsOf_(allSt);
    const g = groups.filter(x => x.key === groupKey)[0] || groups[0] || CONFIG.GROUPS[0];
    const today = todayIso();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(from || ''))) from = today.slice(0, 8) + '01';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(to || ''))) to = today;
    if (from > to) { const t = from; from = to; to = t; }
    const days = isoRange_(from, to);
    if (days.length > CONFIG.MAX_RANGE_DAYS) throw new Error('ช่วงวันที่ยาวเกิน ' + CONFIG.MAX_RANGE_DAYS + ' วัน');
    const st = allSt.filter(s => groupKeyOf_(s) === g.key);
    const data = st.length ? await rpc('get_entries', { p_from: from, p_to: to, p_line_ids: st.map(s => s.id) }) : { entries: [], manpower: [] };
    const D = days.length, fill = v => new Array(D).fill(v);
    const warnings = [], products = {}, lines = [], series = [], lossTot = [];
    st.forEach(function (s, li) {
      const sums = summarize_(s, rowsOf_(s, data), masterAll.map);
      const S = { P: fill(0), A: fill(0), n: fill(0), actN: fill(0), mpP: fill(null), mpA: fill(null), lossEq: fill(0), lossKg: fill(0), base: fill(0), rem: fill(''), prod: fill(null), lt: fill(null) };
      const LT = s.loss.map(() => 0);
      Object.keys(sums).forEach(m => (sums[m].w || []).forEach(w => { if (warnings.length < 80) warnings.push(w); }));
      days.forEach(function (iso, i) {
        const M = sums[iso.slice(0, 7)] || { d: {}, p: {} };
        const x = M.d[iso];
        if (x) {
          S.P[i] = x.P; S.A[i] = x.A; S.n[i] = x.n; S.actN[i] = x.an; S.mpP[i] = x.mp; S.mpA[i] = x.ma;
          S.lossEq[i] = x.le; S.lossKg[i] = x.lk; S.base[i] = x.b; S.rem[i] = x.r;
          x.lt.forEach((v, j) => { LT[j] += v; });
          if (x.lt.some(v => v)) S.lt[i] = x.lt;
        }
        if ((M.p[iso] || []).length) S.prod[i] = M.p[iso].map(e => [e[0], e[1], e[2], e[3], e[4], e[5], e[6] || null, (e[7] || []).slice()]);
        (M.p[iso] || []).forEach(function (e) {
          const pk = li + '|' + e[0];
          const pr = products[pk] || (products[pk] = { li, name: e[0], P: 0, Pd: 0, A: 0, n: 0, lossEq: 0, base: 0, sachet: e[6] || null, lt: s.loss.map(() => 0) });
          pr.P += e[1]; pr.Pd += e[2]; pr.A += e[3]; pr.lossEq += e[4]; pr.base += e[5]; pr.n++;
          if (!pr.sachet && e[6]) pr.sachet = e[6];
          (e[7] || []).forEach((v, j) => { pr.lt[j] += v || 0; });
        });
      });
      lines.push({ name: s.name, unit: s.unit, loss: s.loss.map(l => ({ name: l.name, unit: l.unit })) });
      series.push(S); lossTot.push(LT);
    });
    return {
      group: g, from, to, today,
      days: days.map(d => ({ iso: d, dow: thaiDow_(d) })),
      lines, series, lossTot, products: Object.keys(products).map(k => products[k]),
      warnings, config: publicConfig_(), generatedAt: stamp(), serverMs: Date.now() - t0, fastApi: true
    };
  }

  async function getDayStatus(iso) {
    iso = String(iso || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new Error('วันที่ไม่ถูกต้อง');
    const st = await loadStruct();
    const data = await rpc('get_entries', { p_from: iso, p_to: iso, p_line_ids: null });
    return st.map(s => {
      const E = (data.entries || []).filter(e => Number(e.line_id) === s.id);
      return {
        group: groupKeyOf_(s), unit: s.unit, sheet: s.name,
        n: E.filter(e => e.product).length,
        P: E.reduce((t, e) => t + (Number(e.plan) || 0), 0),
        A: E.reduce((t, e) => t + (Number(e.act) || 0), 0),
        actN: E.filter(e => e.act != null).length
      };
    });
  }

  /* ---------------- PRODUCT MASTER ---------------- */
  async function getMasterData() {

  async function saveProduct(p) {

  /* ---------------- ติดตามงาน (แทน buildModule_ / saveLog) ---------------- */
  function statusKey_(s) {
    const t = norm_(s).toLowerCase();
    if (!t) return 'none';
    if (/^(ok|done|close|closed|complete|completed|finish|เสร็จ|ปิด|แก้ไขแล้ว|เรียบร้อย)/.test(t)) return 'closed';
    if (/^(open|ng|n\/g|not ok|pending|ยังไม่|รอดำเนินการ|ไม่ผ่าน|เปิด|plan|planned|not start|todo|to do|แผน|วางแผน)/.test(t)) return 'open';
    if (/(progress|wip|กำลัง|ระหว่าง|รออะไหล่|ติดตาม|monitor)/.test(t)) return 'progress';
    return 'other';
  }
  async function readModules_(keys) {
    const [items, photos] = await Promise.all([
      selectAll('track_items', 'id, module, item_no, item_date, machine, line_area, reporter, owner, title, cause, solution, status, version', q => q.in('module', keys).order('id')),
      selectAll('photos', 'drive_file_id, item_id, slot, module', q => q.in('module', keys).eq('status', 'attached').not('item_id', 'is', null).order('slot'))
    ]);
    const ph = {};
    photos.forEach(p => { (ph[p.item_id] = ph[p.item_id] || []).push(p.drive_file_id); });
    const now = stamp(), out = {};
    keys.forEach(key => {
      const m = MODULES[key];
      const list = items.filter(x => x.module === key).map(r => {
        const val = {};
        m.fields.forEach(f => {
          const v = r[f.col];
          val[f.k] = f.type === 'date' ? (v ? String(v).slice(0, 10) : '') : f.type === 'no' ? (v == null ? '' : String(v)) : f.type === 'textarea' ? String(v || '').trim() : norm_(v);
        });

  async function gas(body) {

let MODAL_ON_CLOSE = null;
function openModal(title, body, foot, wide) {
  $('mTitle').textContent = title;
  $('mBody').innerHTML = body;
  $('mFoot').innerHTML = foot || '';
  $('modal').classList.toggle('wide', !!wide);
  $('modal').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('modal').hidden = true;
  document.body.style.overflow = '';
  const f = MODAL_ON_CLOSE; MODAL_ON_CLOSE = null; if (f) f();
}
/** กล่องโต้ตอบเล็ก (ซ้อนบน modal ได้) — opts: {title, body, ok, cancel, danger, onOk(async → false = ไม่ปิด)} */
function dlg(opts) {
  return new Promise(resolve => {
    $('dTitle').textContent = opts.title || '';
    $('dBody').innerHTML = opts.body || '';
    $('dErr').textContent = '';
    $('dOk').textContent = opts.ok || 'ตกลง';
    $('dOk').className = 'btn ' + (opts.danger ? 'danger' : 'primary');
    $('dCancel').textContent = opts.cancel || 'ยกเลิก';
    $('dCancel').style.display = opts.cancel === false ? 'none' : '';
    $('dlg').hidden = false;
    const first = $('dBody').querySelector('input'); if (first) setTimeout(() => first.focus(), 30);
    const done = v => { $('dlg').hidden = true; $('dOk').onclick = $('dCancel').onclick = null; $('dBody').onkeydown = null; resolve(v); };
    $('dCancel').onclick = () => done(false);
    $('dOk').onclick = async () => {
      if (!opts.onOk) return done(true);
      $('dOk').disabled = true;
      try { const r = await opts.onOk(); if (r !== false) done(true); }
      catch (e) { $('dErr').textContent = errMsg(e); }
      finally { $('dOk').disabled = false; }
    };
    $('dBody').onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('dOk').click(); };
  });
}
const askConfirm = (title, body, ok, danger) => dlg({ title, body: `<p style="margin:0;line-height:1.6">${body}</p>`, ok: ok || 'ยืนยัน', danger });

   ENTRY — บันทึกผลผลิตรายวัน

const E = { sheet: '', iso: '', data: null, rows: [], loading: false, status: null, statusIso: '' };

function sheetInfo(name) { return APP.boot.sheets.find(s => s.name === name); }
function masterOf(name) { const k = keyOf(name); return APP.boot.products.find(p => keyOf(p.name) === k); }

function buildEntryShell() {
  const opts = APP.boot.groups.map(g => `<optgroup label="${esc(g.label)}">${g.sheets.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</optgroup>`).join('');
  $('page-entry').innerHTML = headerHtml('e', 'บันทึกผลผลิตรายวัน', 'Plan / Actual / Loss / Manpower แยกตามกระบวนการ', btnRefresh('eRefresh'),

  $('ePrev').onclick = () => switchEntry(E.sheet, addDays(E.iso, -1));
  $('eNext').onclick = () => switchEntry(E.sheet, addDays(E.iso, 1));

async function switchEntry(sheet, iso, force) {
  if (APP.dirty && (sheet !== E.sheet || iso !== E.iso || force)) {
    if (!await askConfirm('ยังไม่ได้บันทึก', `ข้อมูลของ <b>${esc(E.sheet)}</b> วันที่ ${esc(thDate(E.iso))} ยังไม่ได้บันทึก ต้องการทิ้งการแก้ไขหรือไม่?`, 'ทิ้งการแก้ไข', true)) {
      $('eSheet').value = E.sheet; $('eDate').value = E.iso; return;
    }
  }
  const dayChanged = iso !== E.iso;
  E.sheet = sheet; E.iso = iso;
  $('eSheet').value = sheet; $('eDate').value = iso;
  store.set('smc_last_sheet', sheet);
  loadEntry(dayChanged || force);
}

function applyEntry(d) {
  E.data = d;
  E.rows = d.rows.map(r => ({ ...r, loss: d.loss.map((_, j) => (r.loss || [])[j] ?? null) }));
  E.mpP = d.mpP; E.mpA = d.mpA;
  if (!E.rows.length) E.rows.push(blankRow());
  APP.dirty = false;
  renderEntry();
}
async function loadEntry(withStatus = true) {
  E.loading = true; APP.dirty = false;
  $('eApp').innerHTML = loaderHtml(`กำลังโหลด ${E.sheet} · ${thDate(E.iso)}…`);
  $('eRefresh').classList.add('spin');
  if (withStatus || !E.status) loadDayStatus();
  const want = E.sheet + '|' + E.iso;
  try {
    const d = await call('getEntry', E.sheet, E.iso);
    if (want !== E.sheet + '|' + E.iso) return;     // ผู้ใช้เปลี่ยนไปแล้ว
    applyEntry(d);
  } catch (e) {
    $('eApp').innerHTML = errHtml('โหลดข้อมูลไม่สำเร็จ', e, 'loadEntry()');
  } finally {
    E.loading = false; $('eRefresh').classList.remove('spin');
  }
}
const blankRow = () => ({ product: '', sachet: null, plan: null, act: null, remark: '', loss: (E.data ? E.data.loss : []).map(() => null) });

function renderEntry() {
  const d = E.data, u = d.unit, isCT = d.has.sachet;

  const warn = (d.warn || []).length ? `<div class="info mt">${SVG.info}<div>${d.warn.map(esc).join('<br>')}</div></div>` : '';
  const prevBtn = d.prev && d.prev.rows.length ? `<button class="btn" data-act="copyprev">${SVG.copy}คัดลอกรายการจาก ${esc(thDate(d.prev.iso))} (${d.prev.rows.length})</button>` : '';
  $('eApp').innerHTML = `${warn}
    <section class="grid ekpis mt" id="eKpis"></section>
    <div class="card mt">
      <div class="card-h"><div><h2>${esc(d.sheet)} · ${esc(thDate(d.iso, true))}</h2>
        <p>${d.rows.length ? `มีข้อมูลเดิม ${d.rows.length} รายการ` : 'ยังไม่มีข้อมูลของวันนี้'} · 1 แถว = 1 สินค้า · ช่องว่าง = ไม่ได้บันทึก (ไม่ใช่ 0)</p></div>
        <span id="eState" class="badge s-off"><i>–</i>ยังไม่มีการแก้ไข</span></div>
      <div class="card-b">
        ${d.has.mp ? `<div class="mprow">
          <div class="fld inl"><label>${SVG.people} Manpower Plan (คน)</label><input class="inp num" id="eMpP" type="number" min="0" step="1" inputmode="numeric" value="${E.mpP ?? ''}" ${d.has.mpP ? '' : 'disabled'}></div>
          <div class="fld inl"><label>${SVG.people} Manpower Actual (คน)</label><input class="inp num" id="eMpA" type="number" min="0" step="1" inputmode="numeric" value="${E.mpA ?? ''}" ${d.has.mpA ? '' : 'disabled'}></div>
          <p class="hint">กรอกครั้งเดียวต่อวัน (บันทึกไว้ที่แถวลำดับ 1 ของวัน)</p></div>` : ''}
        <div class="tbl-wrap etbl-wrap"><table class="etbl">
          <thead><tr><th class="c">#</th><th class="l pcol">Product</th>${isCT ? '<th>Sachet/CT</th>' : ''}<th>Plan<small>${u}</small></th><th>Actual<small>${u}</small></th><th>%</th>${d.has.remark ? '<th class="l">Remark</th>' : ''}${lossHead}<th></th></tr></thead>
          <tbody id="eBody">${E.rows.map(rowHtml).join('')}</tbody>
        </table></div>
        <datalist id="dlProd">${list.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
        <div class="eactions">
          <button class="btn" data-act="add">${SVG.plus}เพิ่มรายการ</button>${prevBtn}

          <button class="btn primary big" data-act="save">${SVG.save}บันทึก</button>
        </div>

  updateEntryTotals();

function rowHtml(r, i) {
  const d = E.data, isCT = d.has.sachet;
  const m = isCT && r.product ? masterOf(r.product) : null;
  const v = x => x == null ? '' : x;
  const p = pct(r.act || 0, r.plan || 0);
  const st = r.plan > 0 && r.act != null ? statusOf(r.act, r.plan) : '';
  return `<tr data-i="${i}">
    <td class="c rn">${i + 1}</td>
    <td class="pcol"><input class="inp" data-f="product" list="dlProd" value="${esc(r.product)}" placeholder="เลือก/พิมพ์ชื่อสินค้า" autocomplete="off"></td>
    ${isCT ? `<td><input class="inp num sm ${m ? 'ro' : ''}" data-f="sachet" type="number" min="0" step="1" value="${m ? m.sachet : v(r.sachet)}" ${m ? 'readonly title="จาก Product Master"' : 'title="ไม่พบใน Product Master — ระบุเอง หรือเพิ่มที่เมนู Product Master"'}></td>` : ''}
    <td><input class="inp num" data-f="plan" type="number" min="0" step="any" inputmode="decimal" value="${v(r.plan)}"></td>
    <td><input class="inp num" data-f="act" type="number" min="0" step="any" inputmode="decimal" value="${v(r.act)}"></td>
